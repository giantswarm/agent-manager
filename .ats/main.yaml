# app-test-suite (ATS >= 1.0) config, consumed by the generated
# `run-tests-with-ats` CircleCI job (execute-chart-tests). The job creates a
# kind cluster; ATS applies the CRDs listed below, installs the packaged chart
# with `helm upgrade --install --wait` (tests/test-values.yaml, the namespace
# below) and runs `pytest -m smoke` in tests/ats.
#
# The smoke (tests/ats/test_smoke.py) is the chart-level install check: the
# chart installs on a bare cluster and its Deployment becomes ready with the
# image the branch build pushed (branchPublish in giantswarm/github makes
# execute-chart-tests wait on that push; the chart resolves the image tag from
# the stamped appVersion). Behaviour against the real platform (Flux, kagent,
# muster) is verified in agentlab.
app-tests-app-config-file: tests/test-values.yaml
app-tests-deploy-namespace: agent-platform

# Manifests applied before the install. ATS passes the value to one
# `kubectl apply --server-side -f`, so a comma-separated list works: ATS's
# bundled CRDs (/etc/ats/crds), the `kagent` namespace the test values point
# the chart at (tests/ats/cluster-prerequisites), plus the APIs agent-manager
# discovers at startup and composes agents from: the Flux
# HelmRelease/OCIRepository CRDs and the kagent.dev/v1alpha3 CRDs
# (AgentTemplate, Harness, RemoteMCPServer, ModelConfig) of the kagent line —
# plain-YAML templates of helm/kagent-crds in giantswarm/kagent-upstream,
# pinned to the line's commit (never the branch: it is force-pushed on every
# re-pin). Without them the service logs a discovery warning and falls back
# to v1alpha3; with them the smoke covers the discovery path. Bump the pins
# together with the platform's Flux and kagent.
cluster-crds: /etc/ats/crds,tests/ats/cluster-prerequisites,https://raw.githubusercontent.com/fluxcd/helm-controller/v1.6.4/config/crd/bases/helm.toolkit.fluxcd.io_helmreleases.yaml,https://raw.githubusercontent.com/fluxcd/source-controller/v1.9.5/config/crd/bases/source.toolkit.fluxcd.io_ocirepositories.yaml,https://raw.githubusercontent.com/giantswarm/kagent-upstream/0ac524031db451634359df3081d7d5d08cea4c93/helm/kagent-crds/templates/kagent.dev_agenttemplates.yaml,https://raw.githubusercontent.com/giantswarm/kagent-upstream/0ac524031db451634359df3081d7d5d08cea4c93/helm/kagent-crds/templates/kagent.dev_harnesses.yaml,https://raw.githubusercontent.com/giantswarm/kagent-upstream/0ac524031db451634359df3081d7d5d08cea4c93/helm/kagent-crds/templates/kagent.dev_remotemcpservers.yaml,https://raw.githubusercontent.com/giantswarm/kagent-upstream/0ac524031db451634359df3081d7d5d08cea4c93/helm/kagent-crds/templates/kagent.dev_modelconfigs.yaml

# functional: no second scenario. upgrade: an upgrade from the last release in
# the catalog is a follow-up.
skip-steps: [functional, upgrade]
