# app-test-suite config, consumed by the generated `run-tests-with-ats`
# CircleCI job (execute-chart-tests).
#
# The cluster test steps are skipped on purpose, as in model-manager: the
# service needs the Flux and kagent CRDs (HelmRelease, OCIRepository, Agent,
# ModelConfig) to do anything, which a bare app-test-suite kind cluster does
# not have. What gates the PR is the build-chart job (app-build-suite lint +
# package + values.schema.json validation). Behavior is verified end to end in
# agentlab, which runs the real platform.
app-tests-app-config-file: tests/test-values.yaml
app-tests-deploy-namespace: agent-platform

skip-steps: [smoke, functional, upgrade]
