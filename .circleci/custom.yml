# Repo-owned additions to the generated .circleci/workflows.yml. The setup
# workflow in config.yml deep-merges this file into it at pipeline runtime;
# devctl never touches it.
#
#   - chart-test: helm lint plus the helm-unittest suites in
#     helm/agent-manager/tests/ (what the Deployment and the MCPServer render
#     from the values — the trusted audiences above all). Not reachable from
#     `make test`: the unittest plugin is not in the architect go image, so the
#     job runs in a plain container with a pinned helm.
#   - test-envtest: `make test-envtest`, the Go tests that need a real
#     kube-apiserver (the tenant ValidatingAdmissionPolicy). The go-build job's
#     `make test` skips them without KUBEBUILDER_ASSETS; this job downloads one
#     with setup-envtest. The architect image carries Go and helm.
#   - verify-release-version: on a tag build, the binary go-build produced
#     must report the tag (without its v); a release whose stamp is lost fails
#     its pipeline.
#   - changelog-check: `make changelog-check`. Every merge to main is a
#     release, so an entry under Unreleased that a tag's CHANGELOG.md already
#     holds is released; the job fails until `make changelog-cut` moves it into
#     that tag's version section. Tags are fetched: the checkout may lack them.
#     Branches only: on main the merge is itself the release being tagged.
version: 2.1

jobs:
  chart-test:
    docker:
      - image: cimg/base:current
    resource_class: small
    environment:
      HELM_VERSION: v3.16.0
    steps:
      - checkout
      - run:
          name: Install helm
          command: |
            set -euxo pipefail
            curl -sSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" | tar -xz -C /tmp
            sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
            helm version --short
      - run:
          name: Run chart tests
          command: make helm-test

  test-envtest:
    executor: architect/architect
    resource_class: medium
    steps:
      - checkout
      - architect/tools-info
      - architect/go-cache-restore
      - run:
          name: Run envtest-backed tests
          command: make test-envtest
      - architect/go-cache-save

  changelog-check:
    executor: architect/architect
    resource_class: small
    steps:
      - checkout
      - run:
          name: Fetch the tags
          command: git fetch --force --tags origin
      - run:
          name: Unreleased holds only changes no tag carries
          command: make changelog-check

  verify-release-version:
    executor: architect/architect
    resource_class: small
    steps:
      - attach_workspace:
          at: .
      - run:
          name: The binary reports the release tag
          command: |
            set -euo pipefail
            want="${CIRCLE_TAG#v}"
            got="$(./agent-manager version | sed -n 's/^agent-manager version //p')"
            echo "tag ${CIRCLE_TAG}, binary reports ${got}"
            test "${got}" = "${want}"

workflows:
  build:
    jobs:
    # Independent of go-build: a chart-only PR gets the signal without waiting
    # on the Go build, and a Go-only PR still proves the chart renders. Same
    # tag filter as the other test jobs.
    - chart-test:
        filters:
          tags:
            only: /^v.*/
    - test-envtest:
        context: architect
        requires:
          - go-build
        filters:
          tags:
            only: /^v.*/
    - changelog-check:
        context: architect
        filters:
          branches:
            ignore: main
    - verify-release-version:
        context: architect
        requires:
          - go-build
        filters:
          tags:
            only: /^v.*/
          branches:
            ignore: /.*/
