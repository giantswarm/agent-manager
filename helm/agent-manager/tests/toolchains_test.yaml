# The toolchain repository start_session mounts a session's toolchains from.
#
# Run with: make helm-test (helm unittest helm/agent-manager)
suite: toolchains
templates:
  - templates/deployment.yaml
set:
  oauth:
    enabled: true
    existingSecret: platform-oauth
  global:
    domain: example.com
    identity:
      issuerUrl: https://dex.example.com
      clientId: platform-client
tests:
  - it: passes none by default
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[*]
          pattern: ^--toolchain-repository

  - it: passes the repository it is given
    set:
      toolchains.repository: registry.example.com/team/toolchains
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --toolchain-repository=registry.example.com/team/toolchains

  - it: passes none without a kagent controller target
    set:
      toolchains.repository: gsoci.azurecr.io/giantswarm/agent-toolchains
      kagent.controllerTarget: ""
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --toolchain-repository=gsoci.azurecr.io/giantswarm/agent-toolchains

  - it: mounts no registry config by default
    set:
      toolchains.repository: gsoci.azurecr.io/giantswarm/agent-toolchains
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[*]
          pattern: ^--toolchain-registry-config
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: toolchain-registry
          any: true

  - it: reads the registry config of the Secret it is given, optional
    set:
      toolchains.repository: gsoci.azurecr.io/giantswarm/agent-toolchains
      toolchains.registryConfig.secretName: toolchain-pull
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --toolchain-registry-config=/etc/agent-manager/toolchain-registry/config.json
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: toolchain-registry
            mountPath: /etc/agent-manager/toolchain-registry
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: toolchain-registry
            secret:
              secretName: toolchain-pull
              optional: true
              items:
                - key: .dockerconfigjson
                  path: config.json

  - it: mounts none without a repository
    set:
      toolchains.registryConfig.secretName: toolchain-pull
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[*]
          pattern: ^--toolchain-registry-config
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: toolchain-registry
          any: true
