# The muster registration: the audiences the MCPServer requires are the same
# ones the Deployment trusts (deployment_test.yaml).
suite: mcpserver registration
templates:
  - templates/mcpserver.yaml
set:
  muster:
    mcpServer:
      enabled: true
      auth:
        requiredAudiences:
          - dex-k8s-authenticator
  oauth:
    enabled: true
    existingSecret: platform-oauth
  global:
    domain: example.com
    identity:
      issuerUrl: https://dex.example.com
      clientId: platform-client
tests:
  - it: forwards the session token and requires the apiserver's audience
    asserts:
      - equal:
          path: spec.auth.type
          value: oauth
      - equal:
          path: spec.auth.forwardToken
          value: true
      - equal:
          path: spec.auth.requiredAudiences
          value:
            - dex-k8s-authenticator
      - equal:
          path: spec.url
          value: http://RELEASE-NAME-agent-manager.NAMESPACE.svc.cluster.local:8080/mcp

  - it: connects anonymously without OAuth
    set:
      oauth:
        enabled: false
    asserts:
      - notExists:
          path: spec.auth

  - it: carries the tool-group label next to the muster type label
    asserts:
      - equal:
          path: metadata.labels["muster.giantswarm.io/type"]
          value: agent-manager
      - equal:
          path: metadata.labels["agent-platform.giantswarm.io/tool-group"]
          value: agent-platform
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: agent-manager

  - it: lets muster.mcpServer.labels add and override labels
    set:
      muster:
        mcpServer:
          labels:
            agent-platform.giantswarm.io/tool-group: infrastructure
            example.com/extra: "yes"
    asserts:
      - equal:
          path: metadata.labels["agent-platform.giantswarm.io/tool-group"]
          value: infrastructure
      - equal:
          path: metadata.labels["example.com/extra"]
          value: "yes"
      - equal:
          path: metadata.labels["muster.giantswarm.io/type"]
          value: agent-manager

  - it: carries the display name the Dev Portal shows
    asserts:
      - equal:
          path: metadata.annotations["ui.giantswarm.io/display-name"]
          value: Agent Manager

  - it: takes the display name from muster.mcpServer.displayName
    set:
      muster:
        mcpServer:
          displayName: Agents
    asserts:
      - equal:
          path: metadata.annotations["ui.giantswarm.io/display-name"]
          value: Agents

  - it: renders no annotations with an empty display name
    set:
      muster:
        mcpServer:
          displayName: ""
    asserts:
      - notExists:
          path: metadata.annotations

  - it: pins the GitHub App and forwards the identity with github.enabled
    set:
      github:
        enabled: true
    asserts:
      - equal:
          path: spec.auth.type
          value: oauth
      - equal:
          path: spec.auth.forwardIdentity
          value: true
      - notExists:
          path: spec.auth.forwardToken
      - equal:
          path: spec.auth.authorizationServer
          value:
            issuer: https://github.com/apps/giantswarm-agent-manager
            expectedIssuer: https://github.com/login/oauth
            authorizationEndpoint: https://github.com/login/oauth/authorize
            tokenEndpoint: https://github.com/login/oauth/access_token
            clientCredentialsSecretRef:
              name: giantswarm-agent-manager-oauth-client
              namespace: NAMESPACE
            grantScope: subject
      - equal:
          path: spec.auth.requiredAudiences
          value:
            - dex-k8s-authenticator

  - it: refuses the GitHub pin without OAuth
    set:
      oauth:
        enabled: false
      github:
        enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "github.enabled verifies the person's GitHub user token next to their ID token, which the server validates as an OAuth resource server: set oauth.enabled"

  - it: forwards the token and names the GitHub App with github.tokenExchange
    set:
      oauth:
        downstream:
          enabled: true
      github:
        enabled: true
        tokenExchange:
          tokenEndpoint: https://muster.example.com/oauth/token
          audience: github
          existingSecret: agent-manager-github-exchange
    asserts:
      - equal:
          path: spec.auth.forwardToken
          value: true
      - equal:
          path: spec.auth.providerApps
          value:
            - github
      - notExists:
          path: spec.auth.authorizationServer
      - notExists:
          path: spec.auth.forwardIdentity

  - it: names no grant App without github.tokenExchange
    asserts:
      - notExists:
          path: spec.auth.providerApps

  - it: refuses github.tokenExchange without github.enabled
    set:
      github:
        tokenExchange:
          tokenEndpoint: https://muster.example.com/oauth/token
          audience: github
          existingSecret: agent-manager-github-exchange
    asserts:
      - failedTemplate:
          errorMessage: "github.tokenExchange needs github.enabled: set github.enabled to true, or unset github.tokenExchange.tokenEndpoint"

  - it: refuses github.tokenExchange without forwardToken
    set:
      oauth:
        downstream:
          enabled: true
      github:
        enabled: true
        tokenExchange:
          tokenEndpoint: https://muster.example.com/oauth/token
          audience: github
          existingSecret: agent-manager-github-exchange
      muster:
        mcpServer:
          auth:
            forwardToken: false
    asserts:
      - failedTemplate:
          errorMessage: "github.tokenExchange lists its App under the MCPServer's providerApps, which muster serves only on a forwarded token: set muster.mcpServer.auth.forwardToken"

  - it: refuses github.tokenExchange without downstream OAuth
    set:
      github:
        enabled: true
        tokenExchange:
          tokenEndpoint: https://muster.example.com/oauth/token
          audience: github
          existingSecret: agent-manager-github-exchange
    asserts:
      - failedTemplate:
          errorMessage: "github.tokenExchange exchanges the person's Dex ID token: set oauth.enabled with oauth.provider dex and oauth.downstream.enabled"

  - it: refuses github.tokenExchange with the Google provider
    set:
      oauth:
        provider: google
        downstream:
          enabled: true
      github:
        enabled: true
        tokenExchange:
          tokenEndpoint: https://muster.example.com/oauth/token
          audience: github
          existingSecret: agent-manager-github-exchange
    asserts:
      - failedTemplate:
          errorMessage: "github.tokenExchange exchanges the person's Dex ID token: set oauth.enabled with oauth.provider dex and oauth.downstream.enabled"

  - it: refuses an audience muster cannot name as a provider App
    set:
      oauth:
        downstream:
          enabled: true
      github:
        enabled: true
        tokenExchange:
          tokenEndpoint: https://muster.example.com/oauth/token
          audience: https://github.com/apps/giantswarm-agent-manager
          existingSecret: agent-manager-github-exchange
    asserts:
      - failedTemplate: {}
