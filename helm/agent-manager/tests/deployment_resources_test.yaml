# The container mounts an emptyDir at /tmp, so Kyverno's
# require-emptydir-requests-and-limits policy demands ephemeral-storage
# requests and limits on it. Defaults carry both; a values override that
# drops them must be a deliberate choice, not a regression.
#
# Run with: make helm-test (helm unittest helm/agent-manager)
suite: deployment resources
templates:
  - templates/deployment.yaml
tests:
  - it: requests and limits ephemeral-storage for the emptyDir at /tmp by default
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.ephemeral-storage
          value: 50Mi
      - equal:
          path: spec.template.spec.containers[0].resources.limits.ephemeral-storage
          value: 100Mi
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tmp
            mountPath: /tmp
      - contains:
          path: spec.template.spec.volumes
          content:
            name: tmp
            emptyDir: {}

  - it: keeps the cpu and memory defaults next to the ephemeral-storage entries
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources
          value:
            requests:
              cpu: 50m
              memory: 64Mi
              ephemeral-storage: 50Mi
            limits:
              cpu: 500m
              memory: 256Mi
              ephemeral-storage: 100Mi
