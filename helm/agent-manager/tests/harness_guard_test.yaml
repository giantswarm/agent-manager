# The claude Harness guards: the per-Harness origin list agent-manager writes
# into a coding agent's egress.
#
# Run with: make helm-test (helm unittest helm/agent-manager)
suite: claude Harness guards
templates:
  - templates/deployment.yaml
set:
  oauth:
    enabled: true
    existingSecret: platform-oauth
  global:
    domain: example.com
    identity:
      issuerUrl: https://dex.example.com
      clientId: platform-client
tests:
  - it: passes the origin lists by Harness name as JSON
    template: templates/deployment.yaml
    set:
      harness.egress:
        claude: [https://github.com]
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].args[?(@ =~ /^--harness-egress=/)]
          pattern: '^--harness-egress=\{"claude":\["https://github.com"\],"claude-go":'

  - it: ships GitHub and the toolchain registries by default
    template: templates/deployment.yaml
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].args[?(@ =~ /^--harness-egress=/)]
          pattern: '"claude-go":\[[^]]*"https://proxy.golang.org"'

  - it: passes no list when none is set
    template: templates/deployment.yaml
    set:
      harness.egress: null
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].args[?(@ =~ /^--harness-egress=/)]
