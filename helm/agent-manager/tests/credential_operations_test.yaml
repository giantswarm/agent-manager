suite: credential operation isolation
templates:
  - templates/credential-operations.yaml
  - templates/deployment.yaml
set:
  tenants.enabled: true
  flux.helmReleaseServiceAccount: agents-flux
  oauth:
    enabled: true
    baseURL: https://agent-manager.example.com
    dex:
      issuerURL: https://identity.example.com
      clientID: agent-platform
    downstream:
      enabled: true
tests:
  - it: creates no operation namespace or permissions by default
    template: templates/credential-operations.yaml
    asserts:
      - hasDocuments:
          count: 0
  - it: grants ConfigMap permissions only in the dedicated namespace
    template: templates/credential-operations.yaml
    set:
      credentials:
        uiURL: https://portal.example.com/credentials?operation={operation}
        operationsNamespace: credential-operations-test
    asserts:
      - hasDocuments:
          count: 4
      - equal:
          path: metadata.name
          value: credential-operations-test
        documentIndex: 0
      - equal:
          path: metadata.namespace
          value: credential-operations-test
        documentIndex: 1
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: [configmaps]
              verbs: [get, list, watch, create, update, delete]
        documentIndex: 1
  - it: refuses metadata storage in the application's namespace
    template: templates/credential-operations.yaml
    release:
      namespace: agent-platform
    set:
      credentials:
        uiURL: https://portal.example.com/credentials?operation={operation}
        operationsNamespace: agent-platform
    asserts:
      - failedTemplate:
          errorMessage: credential operation metadata requires a dedicated namespace
  - it: passes confidential exchange credentials by file
    template: templates/deployment.yaml
    set:
      githubTokenExchange:
        endpoint: https://broker.example.com/oauth/token
        clientID: manager-client
        audience: manager-app
        secretName: broker-client
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --github-token-exchange-client-secret-file=/etc/agent-manager/github-token-exchange/client-secret
      - contains:
          path: spec.template.spec.volumes
          content:
            name: github-token-exchange
            secret:
              secretName: broker-client
              defaultMode: 288
              items:
                - key: client-secret
                  path: client-secret
  - it: refuses the exchange together with the GitHub-pinned registration
    template: templates/deployment.yaml
    set:
      github.enabled: true
      githubTokenExchange:
        endpoint: https://broker.example.com/oauth/token
        clientID: manager-client
        audience: manager-app
        secretName: broker-client
    asserts:
      - failedTemplate:
          errorMessage: "githubTokenExchange.endpoint replaces the GitHub-pinned MCP registration: set github.enabled to false in the same change"
  - it: refuses the exchange without OAuth
    template: templates/deployment.yaml
    set:
      oauth.enabled: false
      githubTokenExchange:
        endpoint: https://broker.example.com/oauth/token
        clientID: manager-client
        audience: manager-app
        secretName: broker-client
    asserts:
      - failedTemplate:
          errorMessage: "githubTokenExchange.endpoint needs oauth.enabled, oauth.downstream.enabled and oauth.provider dex: the person's Dex token is the exchange's subject token"
  - it: refuses the exchange without downstream OAuth
    template: templates/deployment.yaml
    set:
      oauth.downstream.enabled: false
      githubTokenExchange:
        endpoint: https://broker.example.com/oauth/token
        clientID: manager-client
        audience: manager-app
        secretName: broker-client
    asserts:
      - failedTemplate:
          errorMessage: "githubTokenExchange.endpoint needs oauth.enabled, oauth.downstream.enabled and oauth.provider dex: the person's Dex token is the exchange's subject token"
  - it: refuses the exchange with the Google provider
    template: templates/deployment.yaml
    set:
      oauth.provider: google
      githubTokenExchange:
        endpoint: https://broker.example.com/oauth/token
        clientID: manager-client
        audience: manager-app
        secretName: broker-client
    asserts:
      - failedTemplate:
          errorMessage: "githubTokenExchange.endpoint needs oauth.enabled, oauth.downstream.enabled and oauth.provider dex: the person's Dex token is the exchange's subject token"
