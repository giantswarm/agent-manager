suite: credential operation isolation
templates:
  - templates/credential-operations.yaml
  - templates/deployment.yaml
set:
  tenants.enabled: true
  flux.helmReleaseServiceAccount: agents-flux
  oauth:
    enabled: true
    baseURL: https://agent-manager.example.com
    dex:
      issuerURL: https://identity.example.com
      clientID: agent-platform
    downstream:
      enabled: true
tests:
  - it: creates no operation namespace or permissions by default
    template: templates/credential-operations.yaml
    asserts:
      - hasDocuments:
          count: 0
  - it: grants ConfigMap permissions only in the dedicated namespace
    template: templates/credential-operations.yaml
    set:
      credentials:
        uiURL: https://portal.example.com/credentials?operation={operation}
        operationsNamespace: credential-operations-test
    asserts:
      - hasDocuments:
          count: 4
      - equal:
          path: metadata.name
          value: credential-operations-test
        documentIndex: 0
      - equal:
          path: metadata.namespace
          value: credential-operations-test
        documentIndex: 1
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: [configmaps]
              verbs: [get, list, watch, create, update, delete]
        documentIndex: 1
  - it: refuses metadata storage in the application's namespace
    template: templates/credential-operations.yaml
    release:
      namespace: agent-platform
    set:
      credentials:
        uiURL: https://portal.example.com/credentials?operation={operation}
        operationsNamespace: agent-platform
    asserts:
      - failedTemplate:
          errorMessage: credential operation metadata requires a dedicated namespace
  - it: passes confidential exchange credentials by file
    template: templates/deployment.yaml
    set:
      github:
        enabled: true
        tokenExchange:
          tokenEndpoint: https://broker.example.com/oauth/token
          clientID: manager-client
          audience: manager-app
          existingSecret: broker-client
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --github-token-exchange-client-secret-file=/etc/agent-manager/github-token-exchange/client-secret
      - contains:
          path: spec.template.spec.volumes
          content:
            name: github-token-exchange
            secret:
              secretName: broker-client
              defaultMode: 288
  - it: refuses a template without the operation
    template: templates/credential-operations.yaml
    set:
      credentials:
        uiURL: https://portal.example.com/models/{namespace}
        operationsNamespace: model-operations
    asserts:
      - failedTemplate:
          errorMessage: credentials.uiURL requires {operation}
  - it: accepts an organization template with tenancy
    template: templates/credential-operations.yaml
    set:
      credentials:
        uiURL: https://portal.example.com/organizations/test/{parent}/{organization}/credentials/{operation}
        operationsNamespace: model-operations
    asserts:
      - hasDocuments:
          count: 4
  - it: refuses a template without the namespace without tenancy
    template: templates/credential-operations.yaml
    set:
      tenants.enabled: false
      credentials:
        uiURL: https://portal.example.com/organizations/test/{parent}/{organization}/credentials/{operation}
        operationsNamespace: model-operations
    asserts:
      - failedTemplate:
          errorMessage: credentials.uiURL requires {namespace} without tenants.enabled
  - it: accepts form-style expressions without tenancy
    template: templates/credential-operations.yaml
    set:
      tenants.enabled: false
      credentials:
        uiURL: https://portal.example.com/credentials{?namespace,operation}
        operationsNamespace: model-operations
    asserts:
      - hasDocuments:
          count: 4
  - it: accepts path-style expressions without tenancy
    template: templates/credential-operations.yaml
    set:
      tenants.enabled: false
      credentials:
        uiURL: https://portal.example.com/models{/namespace}/credentials{/operation}
        operationsNamespace: model-operations
    asserts:
      - hasDocuments:
          count: 4
  - it: refuses a longer variable name without tenancy
    template: templates/credential-operations.yaml
    set:
      tenants.enabled: false
      credentials:
        uiURL: https://portal.example.com/models/{namespaces}/{operation}
        operationsNamespace: model-operations
    asserts:
      - failedTemplate:
          errorMessage: credentials.uiURL requires {namespace} without tenants.enabled
