# muster's session bindings, which start_session binds a workspace session's
# sandbox at: rendered with the session tools only (OAuth and a controller
# target), and the egress rule to it.
#
# Run with: make helm-test (helm unittest helm/agent-manager)
suite: muster session bindings
templates:
  - templates/deployment.yaml
  - templates/networkpolicy.yaml
set:
  oauth:
    enabled: true
    existingSecret: platform-oauth
  global:
    domain: example.com
    identity:
      issuerUrl: https://dex.example.com
      clientId: platform-client
tests:
  - it: calls the in-cluster muster Service by default
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --muster-bindings-url=http://muster.agent-platform.svc.cluster.local:8090/session-bindings

  - it: renders no bindings without the session tools
    template: templates/deployment.yaml
    set:
      kagent.controllerTarget: ""
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].args[?(@ =~ /^--muster-bindings-url=/)]

  - it: renders no bindings without OAuth
    template: templates/deployment.yaml
    set:
      oauth.enabled: false
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].args[?(@ =~ /^--muster-bindings-url=/)]

  - it: renders no bindings when they are turned off
    template: templates/deployment.yaml
    set:
      muster.bindingsUrl: ""
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].args[?(@ =~ /^--muster-bindings-url=/)]

  - it: opens egress to the muster Service's namespace on its port
    template: templates/networkpolicy.yaml
    set:
      networkPolicy.enabled: true
    asserts:
      - contains:
          path: spec.egress
          content:
            to:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: agent-platform
            ports:
              - {protocol: TCP, port: 8090}

  - it: opens egress to every address on 443 for a public HTTPS endpoint
    template: templates/networkpolicy.yaml
    set:
      networkPolicy.enabled: true
      muster.bindingsUrl: https://muster.example.com/session-bindings
    asserts:
      - contains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: 0.0.0.0/0
            ports:
              - {protocol: TCP, port: 443}

  - it: refuses an endpoint that is not an HTTP one
    template: templates/networkpolicy.yaml
    set:
      networkPolicy.enabled: true
      muster.bindingsUrl: grpc://muster:8090
    asserts:
      - failedTemplate:
          errorPattern: must be http\(s\)://host\[:port\]/session-bindings

  - it: tells agent-manager that muster trusts the actor JWT
    template: templates/deployment.yaml
    set:
      muster.actorBearer: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --muster-actor-bearer=true

  - it: renders no actor bearer by default
    template: templates/deployment.yaml
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].args[?(@ =~ /^--muster-actor-bearer/)]

  - it: renders no actor bearer without bindings
    template: templates/deployment.yaml
    set:
      muster.actorBearer: true
      muster.bindingsUrl: ""
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].args[?(@ =~ /^--muster-actor-bearer/)]

  - it: calls the workspace-manager through muster's MCP endpoint beside the bindings
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --muster-mcp-url=http://muster.agent-platform.svc.cluster.local:8090/mcp
      - contains:
          path: spec.template.spec.containers[0].args
          content: --workspaces-tools-prefix=x_workspace-manager_

  - it: renders no workspace-manager call without a prefix
    template: templates/deployment.yaml
    set:
      muster.workspacesToolsPrefix: ""
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].args[?(@ =~ /^--muster-mcp-url=/)]

  - it: renders no workspace-manager call without the bindings
    template: templates/deployment.yaml
    set:
      muster.bindingsUrl: ""
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].args[?(@ =~ /^--muster-mcp-url=/)]

  - it: calls the toolchain-manager through muster's MCP endpoint with toolchains
    template: templates/deployment.yaml
    set:
      toolchains.repository: gsoci.azurecr.io/giantswarm/agent-toolchains
      muster.toolchainsToolsPrefix: x_toolchain-manager_
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --toolchains-tools-prefix=x_toolchain-manager_
      - contains:
          path: spec.template.spec.containers[0].args
          content: --muster-mcp-url=http://muster.agent-platform.svc.cluster.local:8090/mcp

  - it: renders no toolchain-manager call by default
    template: templates/deployment.yaml
    set:
      toolchains.repository: gsoci.azurecr.io/giantswarm/agent-toolchains
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].args[?(@ =~ /^--toolchains-tools-prefix=/)]

  - it: renders no toolchain-manager call without toolchains
    template: templates/deployment.yaml
    set:
      muster.toolchainsToolsPrefix: x_toolchain-manager_
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].args[?(@ =~ /^--toolchains-tools-prefix=/)]

  - it: calls the toolchain-manager without the bindings, egress open to muster
    set:
      muster.bindingsUrl: ""
      toolchains.repository: gsoci.azurecr.io/giantswarm/agent-toolchains
      muster.toolchainsToolsPrefix: x_toolchain-manager_
      networkPolicy.enabled: true
    asserts:
      - template: templates/deployment.yaml
        contains:
          path: spec.template.spec.containers[0].args
          content: --muster-mcp-url=http://muster.agent-platform.svc.cluster.local:8090/mcp
      - template: templates/deployment.yaml
        notExists:
          path: spec.template.spec.containers[0].args[?(@ =~ /^--workspaces-tools-prefix=/)]
      - template: templates/networkpolicy.yaml
        contains:
          path: spec.egress
          content:
            to:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: agent-platform
            ports:
              - protocol: TCP
                port: 8090
