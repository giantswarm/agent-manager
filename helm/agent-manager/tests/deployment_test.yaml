# The OAuth settings the Deployment renders — above all the audiences of the
# OpenID Provider's trusted issuer entry, which decide whose forwarded ID
# tokens the server accepts.
#
# Run with: make helm-test (helm unittest helm/agent-manager)
suite: deployment oauth settings
templates:
  - templates/deployment.yaml
set:
  oauth:
    enabled: true
    existingSecret: platform-oauth
  global:
    domain: example.com
    identity:
      issuerUrl: https://dex.example.com
      clientId: platform-client
tests:
  - it: trusts the platform client and the audiences the MCPServer requires by default, as the OpenID Provider
    set:
      muster:
        mcpServer:
          auth:
            requiredAudiences:
              - dex-k8s-authenticator
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name == "OAUTH_TRUSTED_ISSUERS")].value
          pattern: '"audiences":\["platform-client","dex-k8s-authenticator"\]'
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: OAUTH_TRUSTED_AUDIENCES
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OAUTH_DEX_CLIENT_ID
            value: platform-client

  - it: trusts only the platform client when no audience is required (a Google-shaped installation)
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name == "OAUTH_TRUSTED_ISSUERS")].value
          pattern: '"audiences":\["platform-client"\]'
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: OAUTH_TRUSTED_AUDIENCES

  - it: adds the required audiences to an explicit list, de-duplicated, order kept
    set:
      oauth:
        trustedAudiences:
          - platform-client
          - portal-client
          - dex-k8s-authenticator
      muster:
        mcpServer:
          auth:
            requiredAudiences:
              - dex-k8s-authenticator
              - kubernetes
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name == "OAUTH_TRUSTED_ISSUERS")].value
          pattern: '"audiences":\["platform-client","portal-client","dex-k8s-authenticator","kubernetes"\]'
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: OAUTH_TRUSTED_AUDIENCES

  - it: trusts the client people sign in with when no platform client is shared, plus the required audiences
    set:
      global:
        identity:
          clientId: ""
      oauth:
        dex:
          clientID: explicit-client
      muster:
        mcpServer:
          auth:
            requiredAudiences:
              - kubernetes
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name == "OAUTH_TRUSTED_ISSUERS")].value
          pattern: '"audiences":\["explicit-client","kubernetes"\]'
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: OAUTH_TRUSTED_AUDIENCES
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OAUTH_DEX_CLIENT_ID
            value: explicit-client

  - it: refuses github.enabled without github.tokenExchange
    set:
      github:
        enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "github.enabled needs github.tokenExchange: commit mode fetches the person's grant of the GitHub App from muster's broker; set github.tokenExchange.tokenEndpoint, audience and existingSecret"

  - it: offers no commit mode by default
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --github-api-url=https://api.github.com
  - it: gives the Dex provider's discovery wait a startup probe longer than its 5 minutes
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].startupProbe.failureThreshold
          value: 33
      - equal:
          path: spec.template.spec.containers[0].startupProbe.periodSeconds
          value: 10

  - it: fetches the GitHub grant with github.tokenExchange
    set:
      oauth:
        downstream:
          enabled: true
      github:
        enabled: true
        tokenExchange:
          tokenEndpoint: https://muster.example.com/oauth/token
          audience: github-app
          existingSecret: agent-manager-github-exchange
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --github-token-exchange-endpoint=https://muster.example.com/oauth/token
      - contains:
          path: spec.template.spec.containers[0].args
          content: --github-token-exchange-audience=github-app
      - contains:
          path: spec.template.spec.containers[0].args
          content: --github-token-exchange-client-id-file=/etc/agent-manager/github-token-exchange/client-id
      - contains:
          path: spec.template.spec.containers[0].args
          content: --github-api-url=https://api.github.com
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --github-token-exchange-client-id=
      - contains:
          path: spec.template.spec.volumes
          content:
            name: github-token-exchange
            secret:
              secretName: agent-manager-github-exchange
              defaultMode: 288

  - it: passes an explicit client ID
    set:
      oauth:
        downstream:
          enabled: true
      github:
        enabled: true
        tokenExchange:
          tokenEndpoint: https://muster.example.com/oauth/token
          audience: github-app
          clientID: agent-manager
          existingSecret: agent-manager-github-exchange
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --github-token-exchange-client-id=agent-manager

  - it: mounts the chart-rendered Secret with an inline client secret
    set:
      oauth:
        downstream:
          enabled: true
      github:
        enabled: true
        tokenExchange:
          tokenEndpoint: https://muster.example.com/oauth/token
          audience: github-app
          clientSecret: fixture-secret
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: github-token-exchange
            secret:
              secretName: RELEASE-NAME-agent-manager-github-token-exchange
              defaultMode: 288

  - it: refuses github.tokenExchange without github.enabled
    set:
      github:
        tokenExchange:
          tokenEndpoint: https://muster.example.com/oauth/token
          audience: github-app
          existingSecret: agent-manager-github-exchange
    asserts:
      - failedTemplate:
          errorMessage: "github.tokenExchange needs github.enabled: set github.enabled to true, or unset github.tokenExchange.tokenEndpoint"

  - it: refuses github.tokenExchange without an audience
    set:
      oauth:
        downstream:
          enabled: true
      github:
        enabled: true
        tokenExchange:
          tokenEndpoint: https://muster.example.com/oauth/token
          existingSecret: agent-manager-github-exchange
    asserts:
      - failedTemplate:
          errorMessage: github.tokenExchange.audience is required with github.tokenExchange.tokenEndpoint

  - it: refuses github.tokenExchange without a client secret
    set:
      oauth:
        downstream:
          enabled: true
      github:
        enabled: true
        tokenExchange:
          tokenEndpoint: https://muster.example.com/oauth/token
          audience: github-app
    asserts:
      - failedTemplate:
          errorMessage: github.tokenExchange.existingSecret or github.tokenExchange.clientSecret is required with github.tokenExchange.tokenEndpoint

  - it: refuses the removed githubTokenExchange key
    set:
      githubTokenExchange:
        endpoint: https://muster.example.com/oauth/token
    asserts:
      - failedTemplate:
          errorPattern: additional properties 'githubTokenExchange' not allowed

  - it: lists the JWKS hosts other than the issuer's that may resolve privately
    set:
      oauth:
        sso:
          allowPrivateIPJWKSHosts:
            - keys.internal.example
            - jwks.internal.example
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name == "OAUTH_TRUSTED_ISSUERS")].value
          pattern: '"allowPrivateIPJWKSHosts":\["dex.example.com","keys.internal.example","jwks.internal.example"\]'

  - it: allows only the issuer's own host to resolve privately by default
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name == "OAUTH_TRUSTED_ISSUERS")].value
          pattern: '"allowPrivateIPJWKSHosts":\["dex.example.com"\]'
