# The OAuth arguments the Deployment renders — above all the trusted
# audiences, which decide whose forwarded id_tokens the server accepts.
#
# Run with: make helm-test (helm unittest helm/agent-manager)
suite: deployment oauth arguments
templates:
  - templates/deployment.yaml
set:
  oauth:
    enabled: true
    existingSecret: platform-oauth
  global:
    domain: example.com
    identity:
      issuerUrl: https://dex.example.com
      clientId: platform-client
tests:
  - it: trusts the platform client and the audiences the MCPServer requires by default
    set:
      muster:
        mcpServer:
          auth:
            requiredAudiences:
              - dex-k8s-authenticator
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --oauth-trusted-audiences=platform-client,dex-k8s-authenticator
      - contains:
          path: spec.template.spec.containers[0].args
          content: --dex-client-id=platform-client

  - it: trusts only the platform client when no audience is required (a Google-shaped installation)
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --oauth-trusted-audiences=platform-client

  - it: adds the required audiences to an explicit list, de-duplicated, order kept
    set:
      oauth:
        trustedAudiences:
          - platform-client
          - portal-client
          - dex-k8s-authenticator
      muster:
        mcpServer:
          auth:
            requiredAudiences:
              - dex-k8s-authenticator
              - kubernetes
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --oauth-trusted-audiences=platform-client,portal-client,dex-k8s-authenticator,kubernetes

  - it: trusts the required audiences even when they are the only ones named
    set:
      global:
        identity:
          clientId: ""
      oauth:
        dex:
          clientID: explicit-client
      muster:
        mcpServer:
          auth:
            requiredAudiences:
              - kubernetes
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --oauth-trusted-audiences=kubernetes
      - contains:
          path: spec.template.spec.containers[0].args
          content: --dex-client-id=explicit-client

  - it: passes the GitHub App pin with github.enabled
    set:
      github:
        enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --github-authorization-server=https://github.com/apps/giantswarm-agent-manager
      - contains:
          path: spec.template.spec.containers[0].args
          content: --github-api-url=https://api.github.com

  - it: offers no commit mode by default
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --github-api-url=https://api.github.com
  - it: gives the Dex provider's discovery wait a startup probe longer than its 5 minutes
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].startupProbe.failureThreshold
          value: 33
      - equal:
          path: spec.template.spec.containers[0].startupProbe.periodSeconds
          value: 10

  - it: replaces the GitHub App pin with github.tokenExchange
    set:
      oauth:
        downstream:
          enabled: true
      github:
        enabled: true
        tokenExchange:
          tokenEndpoint: https://muster.example.com/oauth/token
          audience: github-app
          existingSecret: agent-manager-github-exchange
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --github-token-exchange-endpoint=https://muster.example.com/oauth/token
      - contains:
          path: spec.template.spec.containers[0].args
          content: --github-token-exchange-audience=github-app
      - contains:
          path: spec.template.spec.containers[0].args
          content: --github-token-exchange-client-id-file=/etc/agent-manager/github-token-exchange/client-id
      - contains:
          path: spec.template.spec.containers[0].args
          content: --github-api-url=https://api.github.com
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --github-authorization-server=https://github.com/apps/giantswarm-agent-manager
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --github-token-exchange-client-id=
      - contains:
          path: spec.template.spec.volumes
          content:
            name: github-token-exchange
            secret:
              secretName: agent-manager-github-exchange
              defaultMode: 288

  - it: passes an explicit client ID
    set:
      oauth:
        downstream:
          enabled: true
      github:
        enabled: true
        tokenExchange:
          tokenEndpoint: https://muster.example.com/oauth/token
          audience: github-app
          clientID: agent-manager
          existingSecret: agent-manager-github-exchange
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --github-token-exchange-client-id=agent-manager

  - it: mounts the chart-rendered Secret with an inline client secret
    set:
      oauth:
        downstream:
          enabled: true
      github:
        enabled: true
        tokenExchange:
          tokenEndpoint: https://muster.example.com/oauth/token
          audience: github-app
          clientSecret: fixture-secret
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: github-token-exchange
            secret:
              secretName: RELEASE-NAME-agent-manager-github-token-exchange
              defaultMode: 288

  - it: refuses github.tokenExchange without github.enabled
    set:
      github:
        tokenExchange:
          tokenEndpoint: https://muster.example.com/oauth/token
          audience: github-app
          existingSecret: agent-manager-github-exchange
    asserts:
      - failedTemplate:
          errorMessage: "github.tokenExchange needs github.enabled: set github.enabled to true, or unset github.tokenExchange.tokenEndpoint"

  - it: refuses github.tokenExchange without an audience
    set:
      github:
        enabled: true
        tokenExchange:
          tokenEndpoint: https://muster.example.com/oauth/token
          existingSecret: agent-manager-github-exchange
    asserts:
      - failedTemplate:
          errorMessage: github.tokenExchange.audience is required with github.tokenExchange.tokenEndpoint

  - it: refuses github.tokenExchange without a client secret
    set:
      github:
        enabled: true
        tokenExchange:
          tokenEndpoint: https://muster.example.com/oauth/token
          audience: github-app
    asserts:
      - failedTemplate:
          errorMessage: github.tokenExchange.existingSecret or github.tokenExchange.clientSecret is required with github.tokenExchange.tokenEndpoint

  - it: refuses the removed githubTokenExchange key
    set:
      githubTokenExchange:
        endpoint: https://muster.example.com/oauth/token
    asserts:
      - failedTemplate:
          errorPattern: additional properties 'githubTokenExchange' not allowed
