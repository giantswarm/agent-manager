# tenants.enabled: the organization namespaces managed beside the configured
# ones, found by label with a read-only ServiceAccount, and the ClusterRole
# the agents' HelmReleases run as there; the ServiceAccount writes nothing.
#
# Run with: make helm-test (helm unittest helm/agent-manager)
suite: tenants
templates:
  - templates/tenants-rbac.yaml
  - templates/deployment.yaml
set:
  tenants:
    enabled: true
  flux:
    helmReleaseServiceAccount: agents-flux
  oauth:
    enabled: true
    baseURL: https://agent-manager.example.com
    dex:
      issuerURL: https://dex.example.com
      clientID: platform
    downstream:
      enabled: true
tests:
  - it: renders nothing and passes no flag while off
    set:
      tenants:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0
        template: templates/tenants-rbac.yaml
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --multi-tenant=true
        template: templates/deployment.yaml

  - it: renders the namespace read and nothing else, no Flux ClusterRole
    template: templates/tenants-rbac.yaml
    asserts:
      - hasDocuments:
          count: 2

  - it: needs oauth.downstream, since a request in an organization namespace runs as the caller
    template: templates/tenants-rbac.yaml
    set:
      oauth:
        downstream:
          enabled: false
    asserts:
      - failedTemplate:
          errorPattern: tenants.enabled needs oauth.enabled and oauth.downstream.enabled

  - it: needs the agents' Flux ServiceAccount
    template: templates/tenants-rbac.yaml
    set:
      flux:
        helmReleaseServiceAccount: ""
    asserts:
      - failedTemplate:
          errorPattern: flux.helmReleaseServiceAccount is required with tenants.enabled

  - it: gives the ServiceAccount a read of namespaces and nothing more
    template: templates/tenants-rbac.yaml
    documentIndex: 0
    asserts:
      - isKind:
          of: ClusterRole
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: ["namespaces"]
              verbs: ["get", "list"]

  - it: binds the namespace read to the ServiceAccount
    template: templates/tenants-rbac.yaml
    documentIndex: 1
    asserts:
      - isKind:
          of: ClusterRoleBinding
      - equal:
          path: subjects[0].name
          value: RELEASE-NAME-agent-manager
      - equal:
          path: roleRef.name
          value: RELEASE-NAME-agent-manager-namespaces

  - it: passes the tenant flag and no reconciler flag
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --multi-tenant=true
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[*]
          pattern: ^--tenant-

  - it: passes the organizations repository only when one is set
    template: templates/deployment.yaml
    set:
      tenants:
        commit:
          repository: giantswarm/gazelle-config
          objectsPath: management-clusters/gazelle/agent-platform-organizations
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --organizations-repository=giantswarm/gazelle-config
      - contains:
          path: spec.template.spec.containers[0].args
          content: --organizations-objects-path=management-clusters/gazelle/agent-platform-organizations
      - contains:
          path: spec.template.spec.containers[0].args
          content: --organizations-content-prefix=agent-platform/organizations

  - it: passes no organizations repository by default
    template: templates/deployment.yaml
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[*]
          pattern: ^--organizations-

  - it: refuses keys tenants does not take
    template: templates/deployment.yaml
    set:
      tenants:
        workerPoolReplicas: 2
    asserts:
      - failedTemplate: {}

  - it: passes the credential UI template and a dedicated metadata namespace
    template: templates/deployment.yaml
    set:
      credentials:
        uiURL: https://portal.example.com/credentials?operation={operation}
        operationsNamespace: credential-operations-test
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --credential-ui-url=https://portal.example.com/credentials?operation={operation}
      - contains:
          path: spec.template.spec.containers[0].args
          content: --credential-operations-namespace=credential-operations-test

  - it: passes no credential UI by default
    template: templates/deployment.yaml
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[*]
          pattern: ^--credential-
