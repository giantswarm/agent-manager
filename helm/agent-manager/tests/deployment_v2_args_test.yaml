# The kagent API arguments the Deployment renders: the Generic chart 2.x
# range, the platform Harness, and the muster URL only when set.
#
# Run with: make helm-test (helm unittest helm/agent-manager)
suite: deployment kagent v2 arguments
templates:
  - templates/deployment.yaml
tests:
  - it: tracks the Generic chart at 2.x and names the platform Harness by default
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --agent-chart-semver=2.x
      - contains:
          path: spec.template.spec.containers[0].args
          content: --harness-name=kagent
      - contains:
          path: spec.template.spec.containers[0].args
          content: --kagent-api-version=auto
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --agent-chart-semver=x.x.x

  - it: forwards the muster URL for agents on workload clusters only when set
    set:
      muster:
        targetUrl: https://muster.installation.example/mcp
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --target-muster-url=https://muster.installation.example/mcp

  - it: renders no target muster URL by default
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].args[?(@ =~ /^--target-muster-url=/)]

  - it: filters the chart's tags only when a filter is set
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].args[?(@ =~ /^--agent-chart-semver-filter=/)]

  - it: forwards the chart's tag filter
    set:
      agentChart:
        semver: ">=1.5.0-0 <2.0.0-0"
        semverFilter: '^v?[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --agent-chart-semver=>=1.5.0-0 <2.0.0-0
      - contains:
          path: spec.template.spec.containers[0].args
          content: --agent-chart-semver-filter=^v?[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$

  - it: composes no muster URL unless one is set
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].args[?(@ =~ /^--muster-url=/)]

  - it: forwards the platform's muster URL and Harness when set
    set:
      muster:
        url: http://muster.agent-platform.svc.cluster.local:8090/mcp
      harness:
        name: claude
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --muster-url=http://muster.agent-platform.svc.cluster.local:8090/mcp
      - contains:
          path: spec.template.spec.containers[0].args
          content: --harness-name=claude
