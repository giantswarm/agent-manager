suite: github token exchange secret
templates:
  - templates/github-token-exchange-secret.yaml
set:
  oauth:
    enabled: true
    existingSecret: platform-oauth
  github:
    enabled: true
    tokenExchange:
      tokenEndpoint: https://muster.example.com/oauth/token
      audience: github-app
tests:
  - it: renders the client secret and client ID when given inline
    set:
      github:
        tokenExchange:
          clientID: agent-manager
          clientSecret: fixture-secret
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-agent-manager-github-token-exchange
      - equal:
          path: stringData
          value:
            client-secret: fixture-secret
            client-id: agent-manager

  - it: leaves client-id to the server's flag when clientID is empty
    set:
      github:
        tokenExchange:
          clientSecret: fixture-secret
    asserts:
      - notExists:
          path: stringData.client-id

  - it: renders nothing with an existing Secret
    set:
      github:
        tokenExchange:
          clientSecret: fixture-secret
          existingSecret: agent-manager-github-exchange
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing without github.tokenExchange
    set:
      github:
        tokenExchange:
          tokenEndpoint: ""
    asserts:
      - hasDocuments:
          count: 0
