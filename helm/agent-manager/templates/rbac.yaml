{{- /*
No RBAC at all with oauth.downstream: every Kubernetes call then carries the
caller's IdP token and the caller's RBAC governs; the ServiceAccount keeps only
what every authenticated principal has (API discovery). The token stays
mounted for the in-cluster API address and CA.
*/}}
{{- if include "agent-manager.serviceAccountRBAC" . }}
{{- /*
One Role per managed namespace. agent-manager writes the two kagent.dev objects
an agent consists of (the AgentTemplate and its toolset carrier, a per-agent
RemoteMCPServer) and reads everything it validates against and reports on: the
platform's muster RemoteMCPServer the carriers are copied from, the Harnesses
whose admission selectors must match a template, and the ModelConfigs an agent
may reference (platform-admin owned, never written).
*/}}
{{- range $ns := (include "agent-manager.managedNamespaces" . | fromJsonArray) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "agent-manager.fullname" $ }}
  namespace: {{ $ns }}
  labels:
    {{- include "agent-manager.labels" $ | nindent 4 }}
rules:
  - apiGroups: ["kagent.dev"]
    resources: ["agenttemplates", "remotemcpservers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["kagent.dev"]
    resources: ["harnesses", "modelconfigs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "agent-manager.fullname" $ }}
  namespace: {{ $ns }}
  labels:
    {{- include "agent-manager.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "agent-manager.fullname" $ }}
subjects:
  - kind: ServiceAccount
    name: {{ include "agent-manager.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
