{{- /*
No RBAC at all with oauth.downstream: every Kubernetes call then carries the
caller's IdP token and the caller's RBAC governs; the ServiceAccount keeps only
what every authenticated principal has (API discovery). The token stays
mounted for the in-cluster API address and CA.
*/}}
{{- if include "agent-manager.serviceAccountRBAC" . }}
{{- /*
One Role per managed namespace. agent-manager writes the two Flux objects an
agent consists of (HelmRelease + the shared OCIRepository of the Generic agent
chart) and reads everything it reports on: the api.kagent.dev/v1alpha3 Agent
and the agent's RemoteMCPServer the chart renders, the Harnesses an Agent
references (a create checks the named one exists and which runtime it is),
the ModelConfigs an agent may reference (platform-admin owned, never
written), and the namespace's events for get_agent_status. Nothing names the
kagent.dev group; there is no per-agent Deployment or pod to read.
*/}}
{{- range $ns := (include "agent-manager.managedNamespaces" . | fromJsonArray) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "agent-manager.fullname" $ }}
  namespace: {{ $ns }}
  labels:
    {{- include "agent-manager.labels" $ | nindent 4 }}
rules:
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["ocirepositories"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["api.kagent.dev"]
    resources: ["agents", "harnesses", "remotemcpservers", "modelconfigs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["api.kagent.dev"]
    resources: ["agents", "remotemcpservers"]
    # What a release leaves behind is only ever deleted with force: a bare
    # Agent (no HelmRelease behind it), or the rendered objects of a
    # suspended release Flux drops without uninstalling. helm-controller
    # removes the ones agent-manager created.
    verbs: ["delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "agent-manager.fullname" $ }}
  namespace: {{ $ns }}
  labels:
    {{- include "agent-manager.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "agent-manager.fullname" $ }}
subjects:
  - kind: ServiceAccount
    name: {{ include "agent-manager.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
