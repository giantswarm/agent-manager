{{- if and .Values.github.enabled (not .Values.oauth.enabled) }}
{{- fail "github.enabled verifies the person's GitHub user token next to their ID token, which the server validates as an OAuth resource server: set oauth.enabled" }}
{{- end }}
{{- $githubTokenExchange := include "agent-manager.githubTokenExchange" . }}
{{- $githubPin := and .Values.github.enabled (not $githubTokenExchange) }}
{{- $exchange := .Values.muster.mcpServer.auth.tokenExchange }}
{{- if and $exchange.enabled $githubPin }}
{{- fail "muster.mcpServer.auth.tokenExchange and github.enabled are two ways for muster to authenticate to this server: set one" }}
{{- end }}
{{- if and $exchange.enabled (not .Values.oauth.enabled) }}
{{- fail "muster.mcpServer.auth.tokenExchange makes muster present a Dex token, which the server validates as an OAuth resource server: set oauth.enabled" }}
{{- end }}
{{- if .Values.muster.mcpServer.enabled }}
{{- /*
Registers this server with muster. Tools appear as x_<name>_<tool>. With
oauth.enabled the CR carries the auth block: muster forwards the session's IdP
id_token (forwardToken), which this server validates through
oauth.trustedAudiences, and requests the requiredAudiences at login. Without
OAuth muster connects anonymously. With github.enabled and
github.tokenExchange the auth lists the App (github.tokenExchange.audience)
under providerApps, so muster answers a grant_required with its sign-in link.
With github.enabled alone the auth pins the GitHub App instead (deprecated):
the bearer is the person's App user token (commit mode's pull request) and
forwardIdentity puts the ID token in X-Muster-Id-Token next to it. With
muster.mcpServer.auth.tokenExchange muster exchanges the session's token at
Dex for one carrying the requiredAudiences instead of forwarding it.
*/}}
apiVersion: muster.giantswarm.io/v1alpha1
kind: MCPServer
metadata:
  name: {{ .Values.muster.mcpServer.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- /*
    agent-platform.giantswarm.io/tool-group puts this server into the platform's
    Agent Platform tier (the MCP servers page, the `agent-platform` toolset
    preset). muster.mcpServer.labels is merged last, so it can add or override
    any of these.
    */}}
    {{- $labels := dict "muster.giantswarm.io/type" "agent-manager" "agent-platform.giantswarm.io/tool-group" "agent-platform" }}
    {{- $labels = mergeOverwrite $labels (include "agent-manager.labels" . | fromYaml) (default (dict) .Values.muster.mcpServer.labels) }}
    {{- toYaml $labels | nindent 4 }}
  {{- with .Values.muster.mcpServer.displayName }}
  annotations:
    ui.giantswarm.io/display-name: {{ . | quote }}
  {{- end }}
spec:
  autoStart: {{ .Values.muster.mcpServer.autoStart }}
  type: streamable-http
  url: http://{{ include "agent-manager.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.port }}{{ .Values.mcp.path }}
  {{- with .Values.muster.mcpServer.description }}
  description: {{ . | quote }}
  {{- end }}
  {{- if and .Values.oauth.enabled $githubPin }}
  {{- with .Values.github.authorizationServer }}
  auth:
    type: oauth
    authorizationServer:
      issuer: {{ .issuer | quote }}
      {{- with .expectedIssuer }}
      expectedIssuer: {{ . | quote }}
      {{- end }}
      authorizationEndpoint: {{ .authorizationEndpoint | quote }}
      tokenEndpoint: {{ .tokenEndpoint | quote }}
      {{- with .scopes }}
      scopes: {{ . | quote }}
      {{- end }}
      clientCredentialsSecretRef:
        name: {{ .clientCredentialsSecretRef.name | quote }}
        namespace: {{ .clientCredentialsSecretRef.namespace | default $.Release.Namespace | quote }}
      grantScope: {{ .grantScope | quote }}
    forwardIdentity: true
    {{- with $.Values.muster.mcpServer.auth.requiredAudiences }}
    requiredAudiences:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
  {{- else if $exchange.enabled }}
  auth:
    type: oauth
    forwardToken: false
    tokenExchange:
      enabled: true
      dexTokenEndpoint: {{ $exchange.dexTokenEndpoint | default (printf "%s/token" (include "agent-manager.oauthDexIssuerURL" . | trimSuffix "/")) | quote }}
      {{- with $exchange.expectedIssuer }}
      expectedIssuer: {{ . | quote }}
      {{- end }}
      connectorId: {{ required "muster.mcpServer.auth.tokenExchange.connectorId is required: the Dex connector that verifies the session's token" $exchange.connectorId | quote }}
      {{- with $exchange.scopes }}
      scopes: {{ . | quote }}
      {{- end }}
      clientCredentialsSecretRef:
        name: {{ required "muster.mcpServer.auth.tokenExchange.clientCredentialsSecretRef.name is required: the Secret with muster's Dex client" $exchange.clientCredentialsSecretRef.name | quote }}
        namespace: {{ $exchange.clientCredentialsSecretRef.namespace | default .Release.Namespace | quote }}
    {{- with .Values.muster.mcpServer.auth.requiredAudiences }}
    requiredAudiences:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- else if .Values.oauth.enabled }}
  auth:
    type: oauth
    forwardToken: {{ .Values.muster.mcpServer.auth.forwardToken }}
    {{- if and $githubTokenExchange .Values.muster.mcpServer.auth.forwardToken }}
    providerApps:
      - {{ .Values.github.tokenExchange.audience | quote }}
    {{- end }}
    {{- with .Values.muster.mcpServer.auth.requiredAudiences }}
    requiredAudiences:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
{{- end }}
