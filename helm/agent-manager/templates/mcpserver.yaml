{{- if and .Values.github.enabled (not .Values.oauth.enabled) }}
{{- fail "github.enabled pins the MCPServer to the GitHub App and forwards the person's ID token next to its user token, which the server validates as an OAuth resource server: set oauth.enabled" }}
{{- end }}
{{- if .Values.muster.mcpServer.enabled }}
{{- /*
Registers this server with muster. Tools appear as x_<name>_<tool>. With
oauth.enabled the CR carries the auth block: muster forwards the session's IdP
id_token (forwardToken), which this server validates through
oauth.trustedAudiences, and requests the requiredAudiences at login. Without
OAuth muster connects anonymously. With github.enabled the auth pins the
GitHub App giantswarm-agent-manager instead: the bearer is the person's App
user token (commit mode's pull request) and forwardIdentity puts the ID token
in X-Muster-Id-Token next to it.
*/}}
apiVersion: muster.giantswarm.io/v1alpha1
kind: MCPServer
metadata:
  name: {{ .Values.muster.mcpServer.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- /*
    agent-platform.giantswarm.io/tool-group puts this server into the platform's
    Agent Platform tier (the MCP servers page, the `agent-platform` toolset
    preset). muster.mcpServer.labels is merged last, so it can add or override
    any of these.
    */}}
    {{- $labels := dict "muster.giantswarm.io/type" "agent-manager" "agent-platform.giantswarm.io/tool-group" "agent-platform" }}
    {{- $labels = mergeOverwrite $labels (include "agent-manager.labels" . | fromYaml) (default (dict) .Values.muster.mcpServer.labels) }}
    {{- toYaml $labels | nindent 4 }}
spec:
  autoStart: {{ .Values.muster.mcpServer.autoStart }}
  type: streamable-http
  url: http://{{ include "agent-manager.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.port }}{{ .Values.mcp.path }}
  {{- with .Values.muster.mcpServer.description }}
  description: {{ . | quote }}
  {{- end }}
  {{- if and .Values.oauth.enabled .Values.github.enabled }}
  {{- with .Values.github.authorizationServer }}
  auth:
    type: oauth
    authorizationServer:
      issuer: {{ .issuer | quote }}
      {{- with .expectedIssuer }}
      expectedIssuer: {{ . | quote }}
      {{- end }}
      authorizationEndpoint: {{ .authorizationEndpoint | quote }}
      tokenEndpoint: {{ .tokenEndpoint | quote }}
      {{- with .scopes }}
      scopes: {{ . | quote }}
      {{- end }}
      clientCredentialsSecretRef:
        name: {{ .clientCredentialsSecretRef.name | quote }}
        namespace: {{ .clientCredentialsSecretRef.namespace | default $.Release.Namespace | quote }}
      grantScope: {{ .grantScope | quote }}
    forwardIdentity: true
    {{- with $.Values.muster.mcpServer.auth.requiredAudiences }}
    requiredAudiences:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
  {{- else if .Values.oauth.enabled }}
  auth:
    type: oauth
    forwardToken: {{ .Values.muster.mcpServer.auth.forwardToken }}
    {{- with .Values.muster.mcpServer.auth.requiredAudiences }}
    requiredAudiences:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
{{- end }}
