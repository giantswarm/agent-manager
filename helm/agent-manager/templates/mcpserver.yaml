{{- if .Values.muster.mcpServer.enabled }}
{{- /*
Registers this server with muster. Tools appear as x_<name>_<tool>. The chart
serves MCP without authentication: muster is the auth enforcement point and
reaches the endpoint in-cluster, so the CR carries no auth block.
*/}}
apiVersion: muster.giantswarm.io/v1alpha1
kind: MCPServer
metadata:
  name: {{ .Values.muster.mcpServer.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    muster.giantswarm.io/type: agent-manager
    {{- include "agent-manager.labels" . | nindent 4 }}
    {{- with .Values.muster.mcpServer.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  autoStart: {{ .Values.muster.mcpServer.autoStart }}
  type: streamable-http
  url: http://{{ include "agent-manager.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.port }}{{ .Values.mcp.path }}
  {{- with .Values.muster.mcpServer.description }}
  description: {{ . | quote }}
  {{- end }}
{{- end }}
