{{- if .Values.credentials.uiURL }}
{{- if not (and .Values.oauth.enabled .Values.oauth.downstream.enabled) }}
{{- fail "credential forms require oauth.enabled and oauth.downstream.enabled" }}
{{- end }}
{{- $uiURL := .Values.credentials.uiURL }}
{{- if or (not (regexMatch `^https://[^/{}?#@]+([/?]|\{[/?])` $uiURL)) (contains "#" $uiURL) (regexMatch `[{}]` (regexReplaceAll `\{[^{}]*\}` $uiURL "")) }}
{{- fail "credentials.uiURL must be an https URL template with a fixed host, no fragment and no variable in its host" }}
{{- end }}
{{- $variables := list }}
{{- range $expression := regexFindAll `\{[^{}]*\}` $uiURL -1 }}
{{- range $variable := splitList "," (regexReplaceAll `^\{[+./;?&]?|\}$` $expression "") }}
{{- $variables = append $variables (regexReplaceAll `(:[0-9]+|\*)$` $variable "") }}
{{- end }}
{{- end }}
{{- range $variable := $variables }}
{{- if not (has $variable (list "operation" "organization" "namespace")) }}
{{- fail (printf "credentials.uiURL accepts only {operation}, {organization} and {namespace}, not {%s}" $variable) }}
{{- end }}
{{- end }}
{{- if ne (len (without $variables "organization" "namespace")) 1 }}
{{- fail "credentials.uiURL requires one {operation}" }}
{{- end }}
{{- if and (not .Values.tenants.enabled) (or (not (has "namespace" $variables)) (has "organization" $variables)) }}
{{- fail "credentials.uiURL requires {namespace} and no {organization} without tenants.enabled" }}
{{- end }}
{{- $namespace := include "agent-manager.credentialOperationsNamespace" . }}
{{- if eq $namespace .Release.Namespace }}
{{- fail "credential operation metadata requires a dedicated namespace" }}
{{- end }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $namespace }}
  labels:
    {{- include "agent-manager.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: credential-operations
  namespace: {{ $namespace }}
  labels:
    {{- include "agent-manager.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: credential-operations
  namespace: {{ $namespace }}
  labels:
    {{- include "agent-manager.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: credential-operations
subjects:
  - kind: ServiceAccount
    name: {{ include "agent-manager.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: credential-operations
  namespace: {{ $namespace }}
spec:
  hard:
    count/configmaps: "256"
{{- end }}
