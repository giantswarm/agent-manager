{{- if or .Values.credentials.uiURL .Values.credentials.platformUIURL }}
{{- if not (and .Values.oauth.enabled .Values.oauth.downstream.enabled) }}
{{- fail "credential forms require oauth.enabled and oauth.downstream.enabled" }}
{{- end }}
{{- if and .Values.credentials.uiURL (not .Values.tenants.enabled) }}
{{- fail "credentials.uiURL requires tenants.enabled" }}
{{- end }}
{{- $namespace := include "agent-manager.credentialOperationsNamespace" . }}
{{- if eq $namespace .Release.Namespace }}
{{- fail "credential operation metadata requires a dedicated namespace" }}
{{- end }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $namespace }}
  labels:
    {{- include "agent-manager.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: credential-operations
  namespace: {{ $namespace }}
  labels:
    {{- include "agent-manager.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: credential-operations
  namespace: {{ $namespace }}
  labels:
    {{- include "agent-manager.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: credential-operations
subjects:
  - kind: ServiceAccount
    name: {{ include "agent-manager.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: credential-operations
  namespace: {{ $namespace }}
spec:
  hard:
    count/configmaps: "256"
{{- end }}
