apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent-manager.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-manager.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "agent-manager.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "agent-manager.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "agent-manager.serviceAccountName" . }}
      {{- /*
      The token is always mounted: it carries the in-cluster API address and
      CA, and API discovery at startup. With oauth.downstream that is all the
      ServiceAccount does (rbac.yaml renders nothing for it); every request
      presents the caller's token instead.
      */}}
      automountServiceAccountToken: true
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
            - --listen=:8080
            - --in-cluster=true
            - --kagent-namespace={{ .Values.kagent.namespace }}
            {{- with .Values.kagent.additionalNamespaces }}
            - --managed-namespaces={{ join "," . }}
            {{- end }}
            - --kagent-api-version={{ .Values.kagent.apiVersion }}
            - --flux-helmrelease-api-version={{ .Values.flux.helmReleaseApiVersion }}
            - --flux-ocirepository-api-version={{ .Values.flux.ociRepositoryApiVersion }}
            - --agent-chart-oci-url={{ .Values.agentChart.ociUrl }}
            - --agent-chart-semver={{ .Values.agentChart.semver }}
            - --agent-chart-refresh={{ .Values.agentChart.refresh }}
            - --helmrelease-interval={{ .Values.flux.helmReleaseInterval }}
            - --ocirepository-interval={{ .Values.flux.ociRepositoryInterval }}
            {{- with .Values.flux.helmReleaseServiceAccount }}
            - --helmrelease-service-account={{ . }}
            {{- end }}
            {{- with .Values.skills.repositories }}
            - --skills-repositories={{ join "," . }}
            {{- end }}
            - --skills-github-api={{ .Values.skills.github.apiUrl }}
            - --skills-cache-ttl={{ .Values.skills.cacheTTL }}
            - --mcp-enabled={{ .Values.mcp.enabled }}
            - --mcp-path={{ .Values.mcp.path }}
            {{- if .Values.oauth.enabled }}
            - --enable-oauth=true
            - --oauth-base-url={{ include "agent-manager.oauthBaseURL" . }}
            - --oauth-provider={{ .Values.oauth.provider }}
            {{- with include "agent-manager.oauthTrustedAudiences" . }}
            - --oauth-trusted-audiences={{ . }}
            {{- end }}
            {{- if .Values.oauth.sso.allowPrivateIPs }}
            - --sso-allow-private-ips=true
            {{- end }}
            {{- if .Values.oauth.allowPublicClientRegistration }}
            - --allow-public-client-registration=true
            {{- end }}
            {{- if .Values.oauth.downstream.enabled }}
            - --downstream-oauth=true
            {{- end }}
            {{- if eq .Values.oauth.provider "dex" }}
            - --dex-issuer-url={{ include "agent-manager.oauthDexIssuerURL" . }}
            - --dex-client-id={{ include "agent-manager.oauthDexClientID" . }}
            {{- if .Values.oauth.dex.allowPrivateURLs }}
            - --allow-private-oauth-urls=true
            {{- end }}
            {{- if include "agent-manager.oauthDexCASecretName" . }}
            - --dex-ca-file=/etc/agent-manager/idp-ca/{{ include "agent-manager.oauthDexCASecretKey" . }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if .Values.logging.verbose }}
            - --verbose
            {{- end }}
            {{- with .Values.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if or .Values.skills.github.tokenSecret.name .Values.oauth.enabled .Values.extraEnv }}
          env:
            {{- if .Values.oauth.enabled }}
            {{- if eq .Values.oauth.provider "google" }}
            {{- if .Values.oauth.google.clientID }}
            - name: GOOGLE_CLIENT_ID
              value: {{ .Values.oauth.google.clientID | quote }}
            {{- else }}
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "agent-manager.oauthSecretName" . }}
                  key: google-client-id
            {{- end }}
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "agent-manager.oauthSecretName" . }}
                  key: google-client-secret
            {{- else }}
            - name: DEX_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "agent-manager.oauthSecretName" . }}
                  key: dex-client-secret
            {{- end }}
            {{- end }}
            {{- with .Values.skills.github.tokenSecret.name }}
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.skills.github.tokenSecret.key }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- $idpCA := "" }}
          {{- if and .Values.oauth.enabled (eq .Values.oauth.provider "dex") }}{{ $idpCA = include "agent-manager.oauthDexCASecretName" . }}{{ end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if $idpCA }}
            - name: idp-ca
              mountPath: /etc/agent-manager/idp-ca
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if $idpCA }}
        - name: idp-ca
          secret:
            secretName: {{ $idpCA }}
            items:
              - key: {{ include "agent-manager.oauthDexCASecretKey" . }}
                path: {{ include "agent-manager.oauthDexCASecretKey" . }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
