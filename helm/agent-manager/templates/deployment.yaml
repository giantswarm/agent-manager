{{- $githubTokenExchange := include "agent-manager.githubTokenExchange" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent-manager.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-manager.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "agent-manager.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "agent-manager.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "agent-manager.serviceAccountName" . }}
      {{- /*
      The token is always mounted: it carries the in-cluster API address and
      CA, and API discovery at startup. With oauth.downstream that is all the
      ServiceAccount does (rbac.yaml renders nothing for it); every request
      presents the caller's token instead.
      */}}
      automountServiceAccountToken: true
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
            - --listen=:8080
            - --in-cluster=true
            - --kagent-namespace={{ .Values.kagent.namespace }}
            {{- with .Values.kagent.additionalNamespaces }}
            - --managed-namespaces={{ join "," . }}
            {{- end }}
            - --kagent-api-version={{ .Values.kagent.apiVersion }}
            - --harness-name={{ .Values.harness.name }}
            {{- with .Values.harness.egress }}
            - {{ printf "--harness-egress=%s" (toJson .) | quote }}
            {{- end }}
            {{- with .Values.muster.url }}
            - --muster-url={{ . }}
            {{- end }}
            {{- with .Values.muster.targetUrl }}
            - --target-muster-url={{ . }}
            {{- end }}
            - --flux-helmrelease-api-version={{ .Values.flux.helmReleaseApiVersion }}
            - --flux-ocirepository-api-version={{ .Values.flux.ociRepositoryApiVersion }}
            - --agent-chart-oci-url={{ .Values.agentChart.ociUrl }}
            - --agent-chart-semver={{ .Values.agentChart.semver }}
            {{- with .Values.agentChart.semverFilter }}
            - {{ printf "--agent-chart-semver-filter=%s" . | quote }}
            {{- end }}
            - --agent-chart-refresh={{ .Values.agentChart.refresh }}
            - --helmrelease-interval={{ .Values.flux.helmReleaseInterval }}
            - --ocirepository-interval={{ .Values.flux.ociRepositoryInterval }}
            {{- with .Values.flux.helmReleaseServiceAccount }}
            - --helmrelease-service-account={{ . }}
            {{- end }}
            {{- if .Values.tenants.enabled }}
            - --multi-tenant=true
            {{- end }}
            {{- if or .Values.tenants.enabled .Values.credentials.uiURL }}
            {{- with .Values.tenants.commit.repository }}
            - {{ printf "--organizations-repository=%s" . | quote }}
            - {{ printf "--organizations-branch=%s" $.Values.tenants.commit.branch | quote }}
            - {{ printf "--organizations-objects-path=%s" (required "tenants.commit.objectsPath is required with tenants.commit.repository: the directory the installation's Kustomization applies the organization objects from" $.Values.tenants.commit.objectsPath) | quote }}
            - {{ printf "--organizations-content-prefix=%s" $.Values.tenants.commit.contentPrefix | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.credentials.uiURL }}
            - {{ printf "--credential-ui-url=%s" . | quote }}
            {{- end }}
            {{- if .Values.credentials.uiURL }}
            - --credential-operations-namespace={{ include "agent-manager.credentialOperationsNamespace" $ }}
            {{- end }}
            {{- with .Values.tenants.commit.platformModelsPath }}
            - {{ printf "--platform-models-path=%s" . | quote }}
            {{- end }}
            {{- if $githubTokenExchange }}
            {{- with .Values.github.tokenExchange }}
            - --github-token-exchange-endpoint={{ .tokenEndpoint }}
            - --github-token-exchange-audience={{ .audience }}
            {{- with .clientID }}
            - --github-token-exchange-client-id={{ . }}
            {{- end }}
            - --github-token-exchange-client-id-file=/etc/agent-manager/github-token-exchange/client-id
            - --github-token-exchange-client-secret-file=/etc/agent-manager/github-token-exchange/client-secret
            {{- if .caSecretName }}
            - --github-token-exchange-ca-file=/etc/agent-manager/github-token-exchange-ca/ca.crt
            {{- end }}
            {{- end }}
            {{- end }}
            {{- with .Values.installation }}
            - {{ printf "--installation=%s" . | quote }}
            {{- end }}
            {{- with .Values.skillManager.url }}
            - --skill-manager-url={{ . }}
            {{- end }}
            {{- with .Values.skills.repositories }}
            - --skills-repositories={{ join "," . }}
            {{- end }}
            - --skills-github-api={{ .Values.skills.github.apiUrl }}
            - --skills-cache-ttl={{ .Values.skills.cacheTTL }}
            {{- with include "agent-manager.skillsGitAuthSecretName" . }}
            - --skills-git-auth-secret-name={{ . }}
            {{- end }}
            {{- with (include "agent-manager.skillsGitAuthPreviousSecretNames" . | fromJsonArray) }}
            - --skills-git-auth-previous-secret-names={{ join "," . }}
            {{- end }}
            {{- if .Values.skills.mintGitAuthSecret }}
            - --skills-git-auth-mint=true
            {{- end }}
            {{- with .Values.defaultAgentModel.agent }}
            - --default-model-agent={{ . }}
            {{- end }}
            {{- if .Values.skills.github.app.secretName }}
            {{- if .Values.skills.github.tokenSecret.name }}
            {{- fail "skills.github.app.secretName and skills.github.tokenSecret.name are mutually exclusive: skills are read with one credential" }}
            {{- end }}
            - --skills-github-app-private-key-file=/etc/agent-manager/skills-github-app/private-key
            {{- end }}
            - --mcp-enabled={{ .Values.mcp.enabled }}
            - --mcp-path={{ .Values.mcp.path }}
            {{- if .Values.oauth.enabled }}
            - --enable-oauth=true
            {{- if .Values.oauth.downstream.enabled }}
            - --downstream-oauth=true
            {{- end }}
            {{- with .Values.kagent.controllerTarget }}
            - --kagent-target={{ . }}
            {{- with $.Values.muster.bindingsUrl }}
            - --muster-bindings-url={{ . }}
            {{- if $.Values.muster.actorBearer }}
            - --muster-actor-bearer=true
            {{- end }}
            {{- end }}
            {{- $workspaces := and $.Values.muster.bindingsUrl $.Values.muster.mcpUrl $.Values.muster.workspacesToolsPrefix }}
            {{- $toolchainList := and $.Values.toolchains.repository $.Values.muster.mcpUrl $.Values.muster.toolchainsToolsPrefix }}
            {{- if or $workspaces $toolchainList }}
            - --muster-mcp-url={{ $.Values.muster.mcpUrl }}
            {{- end }}
            {{- if $workspaces }}
            - --workspaces-tools-prefix={{ $.Values.muster.workspacesToolsPrefix }}
            {{- end }}
            {{- with $.Values.toolchains.repository }}
            - --toolchain-repository={{ . }}
            {{- if $.Values.toolchains.registryConfig.secretName }}
            - --toolchain-registry-config=/etc/agent-manager/toolchain-registry/config.json
            {{- end }}
            {{- end }}
            {{- if $toolchainList }}
            - --toolchains-tools-prefix={{ $.Values.muster.toolchainsToolsPrefix }}
            {{- end }}
            {{- end }}
            {{- if .Values.github.enabled }}
            - --github-api-url={{ .Values.github.apiURL }}
            {{- end }}
            {{- end }}
            {{- if .Values.logging.verbose }}
            - --verbose
            {{- end }}
            {{- with .Values.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- /*
          The metrics exporter env below always contributes at least one
          entry (prometheus or none), so this block is unconditional.
          */}}
          env:
            {{- if .Values.oauth.enabled }}
            {{- /* mcp-oauth's settings (oauthconfig.SettingsFromEnv). */}}
            {{- $oauth := include "agent-manager.oauth" . | fromJson }}
            {{- $rs := .Values.oauth.resourceServer }}
            {{- $as := .Values.oauth.authorizationServer }}
            - name: OAUTH_ISSUER
              value: {{ $oauth.issuer | quote }}
            {{- with $rs.resource }}
            - name: OAUTH_RESOURCE
              value: {{ . | quote }}
            {{- end }}
            {{- with $rs.additionalResources }}
            - name: OAUTH_ADDITIONAL_RESOURCES
              value: {{ $resources := list }}{{ range . }}{{ $resources = append $resources (dict "resource" .) }}{{ end }}{{ toJson $resources | quote }}
            {{- end }}
            {{- with $rs.authorizationServers }}
            - name: OAUTH_AUTHORIZATION_SERVERS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with $oauth.trustedIssuers }}
            - name: OAUTH_TRUSTED_ISSUERS
              value: {{ toJson . | quote }}
            {{- end }}
            {{- if $rs.requireResourceAccessTokens }}
            - name: OAUTH_REQUIRE_RESOURCE_ACCESS_TOKENS
              value: "true"
            {{- end }}
            {{- if not $oauth.authorizationServer }}
            - name: OAUTH_ENABLE_AUTHORIZATION_SERVER
              value: "false"
            {{- else }}
            - name: OAUTH_PROVIDER
              value: {{ $oauth.provider | quote }}
            - name: OAUTH_STORAGE_BACKEND
              value: {{ $as.storage.type | quote }}
            - name: OAUTH_ENABLE_CLIENT_ID_METADATA_DOCUMENTS
              value: {{ $as.clientIDMetadataDocuments.enabled | quote }}
            {{- if not $as.dynamicClientRegistration.enabled }}
            - name: OAUTH_ENABLE_DYNAMIC_CLIENT_REGISTRATION
              value: "false"
            {{- end }}
            {{- if $as.dynamicClientRegistration.initialAccessToken.secretKeyRef.name }}
            - name: OAUTH_INITIAL_ACCESS_TOKEN_FILE
              value: /etc/agent-manager/oauth-registration/token
            {{- end }}
            {{- if .Values.oauth.allowPublicClientRegistration }}
            - name: OAUTH_ALLOW_PUBLIC_CLIENT_REGISTRATION
              value: "true"
            {{- end }}
            {{- if eq $oauth.provider "google" }}
            {{- with $oauth.clientIDSecret }}
            - name: OAUTH_GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}
                  key: {{ .key }}
            {{- else }}
            - name: OAUTH_GOOGLE_CLIENT_ID
              value: {{ $oauth.clientID | quote }}
            {{- end }}
            - name: OAUTH_GOOGLE_CLIENT_SECRET_FILE
              value: /etc/agent-manager/oauth-client/client-secret
            - name: OAUTH_GOOGLE_REDIRECT_URL
              value: {{ printf "%s/oauth/callback" ($oauth.issuer | trimSuffix "/") | quote }}
            {{- else }}
            - name: OAUTH_DEX_ISSUER_URL
              value: {{ required "oauth.authorizationServer.upstream.issuer (or global.identity.issuerUrl) is required for the dex provider" $oauth.upstreamIssuer | quote }}
            - name: OAUTH_DEX_CLIENT_ID
              value: {{ required "oauth.authorizationServer.upstream.client.id (or global.identity.clientId) is required for the dex provider" $oauth.clientID | quote }}
            - name: OAUTH_DEX_CLIENT_SECRET_FILE
              value: /etc/agent-manager/oauth-client/client-secret
            {{- with $oauth.upstreamCA }}
            - name: OAUTH_DEX_CA_FILE
              value: {{ printf "%s/%s" .dir .key | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- with .Values.skills.github.app.secretName }}
            - name: AGENT_MANAGER_SKILLS_GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: app-id
            - name: AGENT_MANAGER_SKILLS_GITHUB_APP_INSTALLATION_ID
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: installation-id
            {{- end }}
            {{- with .Values.skills.github.tokenSecret.name }}
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.skills.github.tokenSecret.key }}
            {{- end }}
            {{- with .Values.observability.otel }}
            {{- if .endpoint }}
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .endpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: {{ .protocol | default "grpc" | quote }}
            {{- with .headers }}
            - name: OTEL_EXPORTER_OTLP_HEADERS
              value: {{ . | quote }}
            {{- end }}
            {{- with .sampler }}
            - name: OTEL_TRACES_SAMPLER
              value: {{ . | quote }}
            {{- end }}
            {{- with .samplerArg }}
            - name: OTEL_TRACES_SAMPLER_ARG
              value: {{ . | quote }}
            {{- end }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "k8s.namespace.name=$(K8S_NAMESPACE),k8s.pod.name=$(K8S_POD_NAME),k8s.node.name=$(K8S_NODE_NAME){{- with .resourceAttributes }},{{ . }}{{- end }}"
            {{- end }}
            {{- end }}
            {{- if .Values.observability.metrics.enabled }}
            - name: OTEL_METRICS_EXPORTER
              value: prometheus
            - name: OTEL_EXPORTER_PROMETHEUS_HOST
              value: "0.0.0.0"
            - name: OTEL_EXPORTER_PROMETHEUS_PORT
              value: {{ .Values.observability.metrics.port | quote }}
            {{- else }}
            - name: OTEL_METRICS_EXPORTER
              value: none
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            {{- if .Values.observability.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.observability.metrics.port }}
              protocol: TCP
            {{- end }}
          # Up to 5m30s to serve /healthz: building the Dex provider waits up to
          # 5 minutes for an unavailable Dex, and liveness only starts after this.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 33
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- $oauth := dict "mounts" list }}
          {{- if .Values.oauth.enabled }}{{ $oauth = include "agent-manager.oauth" . | fromJson }}{{ end }}
          {{- $toolchainRegistry := and .Values.kagent.controllerTarget .Values.toolchains.repository .Values.toolchains.registryConfig.secretName }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- range $oauth.mounts }}
            - name: {{ .volume }}
              mountPath: {{ .dir }}
              readOnly: true
            {{- end }}
            {{- if $oauth.authorizationServer }}
            - name: oauth-client
              mountPath: /etc/agent-manager/oauth-client
              readOnly: true
            {{- if .Values.oauth.authorizationServer.dynamicClientRegistration.initialAccessToken.secretKeyRef.name }}
            - name: oauth-registration
              mountPath: /etc/agent-manager/oauth-registration
              readOnly: true
            {{- end }}
            {{- end }}
            {{- if .Values.skills.github.app.secretName }}
            - name: skills-github-app
              mountPath: /etc/agent-manager/skills-github-app
              readOnly: true
            {{- end }}
            {{- if $toolchainRegistry }}
            - name: toolchain-registry
              mountPath: /etc/agent-manager/toolchain-registry
              readOnly: true
            {{- end }}
            {{- if $githubTokenExchange }}
            - name: github-token-exchange
              mountPath: /etc/agent-manager/github-token-exchange
              readOnly: true
            {{- if .Values.github.tokenExchange.caSecretName }}
            - name: github-token-exchange-ca
              mountPath: /etc/agent-manager/github-token-exchange-ca
              readOnly: true
            {{- end }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- range $oauth.mounts }}
        - name: {{ .volume }}
          {{- if .secret }}
          secret:
            secretName: {{ .secret }}
          {{- else }}
          configMap:
            name: {{ .configMap }}
          {{- end }}
            items:
              - key: {{ .key }}
                path: {{ .key }}
        {{- end }}
        {{- if $oauth.authorizationServer }}
        - name: oauth-client
          secret:
            secretName: {{ $oauth.clientSecret.name }}
            defaultMode: 0440
            items:
              - key: {{ $oauth.clientSecret.key }}
                path: client-secret
        {{- with .Values.oauth.authorizationServer.dynamicClientRegistration.initialAccessToken.secretKeyRef }}
        {{- if .name }}
        - name: oauth-registration
          secret:
            secretName: {{ .name }}
            defaultMode: 0440
            items:
              - key: {{ required "oauth.authorizationServer.dynamicClientRegistration.initialAccessToken.secretKeyRef.key is required with its name" .key }}
                path: token
        {{- end }}
        {{- end }}
        {{- end }}
        {{- with .Values.skills.github.app.secretName }}
        - name: skills-github-app
          secret:
            secretName: {{ . }}
            items:
              - key: private-key
                path: private-key
        {{- end }}
        {{- if $toolchainRegistry }}
        - name: toolchain-registry
          secret:
            secretName: {{ .Values.toolchains.registryConfig.secretName }}
            optional: true
            items:
              - key: .dockerconfigjson
                path: config.json
        {{- end }}
        {{- if $githubTokenExchange }}
        - name: github-token-exchange
          secret:
            secretName: {{ include "agent-manager.githubTokenExchangeSecretName" . }}
            defaultMode: 0440
        {{- with .Values.github.tokenExchange.caSecretName }}
        - name: github-token-exchange-ca
          secret:
            secretName: {{ . }}
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
