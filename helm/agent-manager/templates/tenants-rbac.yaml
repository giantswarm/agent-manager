{{- /*
The tenant reconciler's permissions (tenants.enabled). It is background work
without a caller, so it runs as the ServiceAccount whatever oauth.downstream
says, and this RBAC does not depend on agent-manager.serviceAccountRBAC.

RBAC cannot select namespaces by label, so the ClusterRole lets the
ServiceAccount write in every namespace. The ValidatingAdmissionPolicy below
narrows that: the ServiceAccount's writes of the kinds the reconciler keeps
land only in namespaces labelled giantswarm.io/organization (never
kagent.namespace), a RoleBinding only binds agent-platform-tenant-flux to a
ServiceAccount of its own namespace, and the only Secret is the default
ModelConfig's key. Without it, two calls (bind agent-platform-tenant-flux to
itself in kube-system, then read) would give the ServiceAccount every Secret
there.

The reconciler is a controller: it watches what it reads (list and watch),
and its replicas elect a leader with the Lease agent-manager-tenants in the
release namespace (the Role below). Its cache holds the labelled namespaces,
its own labelled copies, the platform namespace's sources and, of the
Secrets, the model key alone: list and watch on Secrets are held to that name
too.

The reconciler binds agent-platform-tenant-flux and nothing else: `bind` on
that one name, no `escalate`. The roles people are bound to and the platform
tenant's bindings belong to agent-platform; memberships are declared, never
written here.
*/}}
{{- if .Values.tenants.enabled }}
{{- if not (and .Values.oauth.enabled .Values.oauth.downstream.enabled) }}
{{- fail "tenants.enabled needs oauth.enabled and oauth.downstream.enabled: requests in a tenant run as the caller, whose RoleBindings there grant the writes; the ServiceAccount's Roles exist only in kagent.namespace and kagent.additionalNamespaces" }}
{{- end }}
{{- $fluxSA := required "flux.helmReleaseServiceAccount is required with tenants.enabled: the agents' HelmReleases in a tenant run as it (Kyverno's flux-multi-tenancy policy refuses one without)" .Values.flux.helmReleaseServiceAccount }}
{{- $sa := include "agent-manager.serviceAccountName" . }}
{{- $flux := include "agent-manager.tenantFluxClusterRole" . }}
{{- $secret := required "tenants.modelConfig.apiKeySecretName is required with tenants.enabled" .Values.tenants.modelConfig.apiKeySecretName }}
{{- $netpol := include "agent-manager.tenantNetworkPolicyResource" . | default "{}" | fromJson }}
{{- $platform := .Values.kagent.namespace }}
---
# What the agents' HelmReleases run as in a tenant namespace (helm-controller
# impersonates the release's ServiceAccount): Secrets (Helm's release storage,
# see the rule) and the two kinds the Generic agent chart 2.x renders, an Agent and its
# RemoteMCPServer.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $flux }}
  labels:
    {{- include "agent-manager.labels" . | nindent 4 }}
rules:
  # Helm's Secret storage driver (helm-controller keeps the release Secrets
  # sh.helm.release.v1.<release>.v<N> in the HelmRelease's namespace) calls
  # get, list, create, update and delete, nothing else. RBAC cannot narrow a
  # list (a label selector is no resourceNames), so this identity can read
  # every Secret of an organization namespace, CAPI cluster kubeconfigs
  # included, and a chart rendered through it can copy one with Helm `lookup`
  # into an object it renders. With create, update and delete such a chart can
  # also overwrite or delete any Secret there, and get the token of any
  # ServiceAccount there (a service-account-token Secret it renders, read back
  # with `lookup`), `automation` (cluster-admin in an org namespace) included.
  # Whoever may create or change a HelmRelease or an OCIRepository there can
  # trigger that: the organization's admins and the members bound to
  # agent-platform:editor or agent-platform:admin.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "delete"]
  - apiGroups: ["api.kagent.dev"]
    resources: ["agents", "remotemcpservers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "agent-manager.fullname" . }}-tenants
  labels:
    {{- include "agent-manager.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  # Whether a tenant holds an agent.
  - apiGroups: ["api.kagent.dev"]
    resources: ["agents"]
    verbs: ["list", "watch"]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["list", "watch"]
  # The copies: read in kagent.namespace, written in the tenants.
  - apiGroups: ["api.kagent.dev"]
    resources: ["harnesses", "modelconfigs"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  - apiGroups: ["ate.dev"]
    resources: ["workerpools"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  {{- with $netpol.resource }}
  - apiGroups: [{{ $netpol.group | quote }}]
    resources: [{{ . | quote }}]
    verbs: ["get", "list", "watch", "create", "update"]
  {{- end }}
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["ocirepositories"]
    verbs: ["get", "list", "watch", "create", "update"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    resourceNames: [{{ $flux | quote }}]
    verbs: ["bind"]
  # The default ModelConfig's key: read in kagent.namespace, copied into the
  # tenants. A list or watch is allowed only with a metadata.name field
  # selector of this name. RBAC cannot name the object of a create; the
  # admission policy holds creates to this name.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $secret | quote }}]
    verbs: ["get", "list", "watch", "update", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "agent-manager.fullname" . }}-tenants
  labels:
    {{- include "agent-manager.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "agent-manager.fullname" . }}-tenants
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "agent-manager.fullname" . }}-tenants
  labels:
    {{- include "agent-manager.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["secrets", "serviceaccounts"]
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["rolebindings"]
      - apiGroups: ["api.kagent.dev"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["harnesses", "modelconfigs"]
      - apiGroups: ["ate.dev"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["workerpools"]
      - apiGroups: ["source.toolkit.fluxcd.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["ocirepositories"]
      {{- with $netpol.resource }}
      - apiGroups: [{{ $netpol.group | quote }}]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: [{{ . | quote }}]
      {{- end }}
  matchConditions:
    - name: agent-manager
      expression: {{ printf "request.userInfo.username == 'system:serviceaccount:%s:%s'" .Release.Namespace $sa | quote }}
  variables:
    - name: tenant
      expression: {{ printf "has(namespaceObject.metadata.labels) && 'giantswarm.io/organization' in namespaceObject.metadata.labels && namespaceObject.metadata.name != '%s'" $platform | quote }}
    # What the ServiceAccount's own namespaced Roles grant in the configured
    # namespaces (rbac.yaml, skills-token.yaml): the agents' OCIRepository
    # without OAuth, and an update of the skills boot Secret.
    - name: configured
      expression: {{ printf "request.namespace in %s && (request.resource.resource == 'ocirepositories' || (request.resource.resource == 'secrets' && request.operation == 'UPDATE' && request.name == '%s'))" (include "agent-manager.managedNamespaces" . | replace "\"" "'") (include "agent-manager.skillsGitAuthSecretName" .) | quote }}
    # The written object read untyped: the policy also matches Secrets and
    # ServiceAccounts, whose types have no roleRef, and the type check of
    # status.typeChecking would flag a typed object.roleRef for them.
    - name: binding
      expression: "dyn(object)"
  validations:
    - expression: "variables.tenant || variables.configured"
      messageExpression: "'agent-manager writes ' + request.resource.resource + ' only in namespaces labelled giantswarm.io/organization; ' + request.namespace + ' is not one'"
    - expression: {{ printf "!variables.tenant || request.resource.resource != 'secrets' || request.name == '%s'" $secret | quote }}
      messageExpression: {{ printf "'agent-manager copies only the Secret %s into a tenant, not ' + request.name" $secret | quote }}
    - expression: {{ printf "request.resource.resource != 'rolebindings' || request.operation == 'DELETE' || (variables.binding.roleRef.kind == 'ClusterRole' && variables.binding.roleRef.name == '%s' && has(variables.binding.subjects) && variables.binding.subjects.all(s, s.kind == 'ServiceAccount' && s.name == '%s' && s.namespace == request.namespace))" $flux $fluxSA | quote }}
      messageExpression: {{ printf "'agent-manager binds only the ClusterRole %s to the ServiceAccount %s of the tenant'" $flux $fluxSA | quote }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "agent-manager.fullname" . }}-tenants
  labels:
    {{- include "agent-manager.labels" . | nindent 4 }}
spec:
  policyName: {{ include "agent-manager.fullname" . }}-tenants
  validationActions: ["Deny"]
---
# The leader Lease of the reconciler's replicas, and the events leader
# election records, in the release namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "agent-manager.fullname" . }}-tenants-leader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-manager.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["agent-manager-tenants"]
    verbs: ["get", "update"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "agent-manager.fullname" . }}-tenants-leader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-manager.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "agent-manager.fullname" . }}-tenants-leader
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
{{- end }}
