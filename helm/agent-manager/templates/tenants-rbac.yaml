{{- /*
What tenants.enabled needs besides the caller's own RBAC.

agent-manager manages the organization namespaces beside the configured ones
and serves the organization tools, all as the caller. Its ServiceAccount only
finds the organization namespaces: RBAC cannot narrow a list by label, so it
may get and list every namespace, read-only, and keeps those labelled
agent-platform.giantswarm.io/organization. It writes nothing, binds nothing
and reads no Secret: agent-platform-operator keeps the organization
namespaces. The ClusterRole agent-platform-tenant-flux the agents' HelmReleases
run as there is the Agent Platform chart's.
*/}}
{{- if .Values.tenants.enabled }}
{{- if not (and .Values.oauth.enabled .Values.oauth.downstream.enabled) }}
{{- fail "tenants.enabled needs oauth.enabled and oauth.downstream.enabled: requests in an organization namespace and the organization tools run as the caller, whose RoleBindings there grant the writes" }}
{{- end }}
{{- $_ := required "flux.helmReleaseServiceAccount is required with tenants.enabled: the agents' HelmReleases in an organization namespace run as it (admission refuses one without)" .Values.flux.helmReleaseServiceAccount }}
{{- $sa := include "agent-manager.serviceAccountName" . }}
---
# The organization namespaces, found by label: read-only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "agent-manager.fullname" . }}-namespaces
  labels:
    {{- include "agent-manager.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "agent-manager.fullname" . }}-namespaces
  labels:
    {{- include "agent-manager.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "agent-manager.fullname" . }}-namespaces
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
{{- end }}
