# Default values for agent-manager.

# -- Number of replicas. The service is stateless (every read goes to the API
# server); more than one is fine.
replicaCount: 1

# -- Number of old ReplicaSets retained for rollback. Keep tight so frequent
# rollouts don't leak zero-replica ReplicaSets across the cluster (each one
# still carries the pod template of an older chart version, and a Kyverno
# background scan reports every stale ReplicaSet that fails a newer policy).
revisionHistoryLimit: 3

image:
  # -- Image registry.
  registry: gsoci.azurecr.io
  # -- Image repository.
  repository: giantswarm/agent-manager
  # -- Image pull policy.
  pullPolicy: IfNotPresent
  # -- Image tag. Defaults to the chart appVersion.
  tag: ""

# -- Image pull secrets.
imagePullSecrets: []
# -- Override the chart name.
nameOverride: ""
# -- Override the fully qualified release name (the umbrella chart pins the
# Service name through this).
fullnameOverride: ""

# The platform contract a parent chart (the `agent-platform` meta chart)
# provides and this chart reads as fallbacks for `oauth.*`: `global.identity.issuerUrl`,
# `global.identity.clientId`, `global.identity.existingSecret`,
# `global.identity.ca.secretName` / `.key`, and `global.domain` for the OAuth
# base URL. Empty here; a chart installed on its own sets `oauth.*` directly.
global: {}  # @schema type: object; additionalProperties: true

kagent:
  # -- Namespace agents are created in and listed from by default — the
  # namespace the kagent controller watches, the platform admin provisions
  # ModelConfigs into and the connectivity chart renders the platform Harness
  # into. The Role for HelmReleases, OCIRepositories, AgentTemplates,
  # RemoteMCPServers, Harnesses, ModelConfigs and events is created here.
  namespace: kagent
  # -- Additional namespaces agents may live in (multi-tenant installs). Each
  # gets the same Role; requests naming any other namespace are refused.
  additionalNamespaces: []
  # -- kagent.dev API version for AgentTemplates, Harnesses, RemoteMCPServers
  # and ModelConfigs; `auto` discovers the version serving `agenttemplates`
  # (default v1alpha3).
  apiVersion: auto

harness:
  # -- Name of the platform Harness every agent runs on (the connectivity
  # chart renders it): the `status.harnesses[]` entry of that name on the
  # AgentTemplate is what `get_agent_status` reports.
  name: kagent

agentChart:
  # -- OCI URL of the Generic `agent` chart every agent renders from (1.x:
  # one release renders one kagent.dev/v1alpha3 AgentTemplate plus the agent's
  # muster RemoteMCPServer). Written into the shared per-namespace
  # OCIRepository, and read at run time for the chart's values.schema.json that
  # validates every create/update before it is applied (the pod needs egress
  # to this registry; the embedded copy of the schema is the offline fallback).
  ociUrl: oci://gsoci.azurecr.io/charts/giantswarm/agent
  # -- Semver range the OCIRepository tracks. `1.x` follows every 1.x release
  # of the Generic chart and never a pre-release build or a next major.
  semver: 1.x
  # -- Regular expression the chart's tags must match before `semver` is
  # evaluated (the OCIRepository's ref.semverFilter, and the version the
  # values schema is read from). Set it beside a range that admits
  # pre-releases (`>=1.5.0-0 <2.0.0-0`): the chart's branch builds are pushed
  # to the same repository, and `^v?[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$`
  # keeps them out while admitting release candidates. Empty filters nothing.
  semverFilter: ""
  # -- How often the registry is re-read for the latest version and schema.
  refresh: 10m

flux:
  # -- HelmRelease.spec.interval of every composed agent.
  helmReleaseInterval: 10m
  # -- OCIRepository.spec.interval of the shared chart source.
  ociRepositoryInterval: 30m
  # -- HelmRelease.spec.serviceAccountName, required by a Flux multi-tenancy
  # admission policy in tenant namespaces; empty omits it.
  helmReleaseServiceAccount: ""
  # -- helm.toolkit.fluxcd.io API version composed into HelmReleases; `auto`
  # discovers it.
  helmReleaseApiVersion: auto
  # -- source.toolkit.fluxcd.io API version composed into OCIRepositories;
  # `auto` discovers it.
  ociRepositoryApiVersion: auto

skills:
  # -- GitHub repositories whose SKILL.md files list_skills offers (the same
  # list the portal's create flow reads), each with the head commit an agent
  # pins. Empty turns the skills capability off; skills given by URL are still
  # resolved through the GitHub API.
  repositories:
    - https://github.com/giantswarm/agent-skills
  github:
    # -- GitHub API base URL.
    apiUrl: https://api.github.com
    app:
      # -- Existing Secret in the release namespace of the read-only skills
      # GitHub App, with the keys `app-id`, `installation-id` and
      # `private-key` (PEM): skills are discovered and pinned with the App's
      # short-lived installation tokens, at the App's rate limit, and a
      # private repository is offered to and usable by only the people who
      # can read it themselves (their GitHub login, verified through the
      # `github` pin below; without the pin private repositories are
      # refused). Mutually exclusive with `tokenSecret`.
      secretName: ""
    tokenSecret:
      # -- Existing Secret in the release namespace with a static GitHub
      # token for skill discovery and pinning. Prefer `app`. Empty (and no
      # `app`): anonymous, public repositories only.
      name: ""
      # -- Key of the token in that Secret.
      key: token
  # -- Secret (key `token`) in the agents' namespace every agent with a git
  # skill fetches its skills with at boot, unless the agent names its own
  # `gitAuthSecretName`: composed as the agent chart's
  # `skillsGitAuthSecretRef.name`. Empty: such agents fetch anonymously.
  gitAuthSecretName: ""
  # -- Boot private git skills with the skills GitHub App instead of a
  # provisioned token (needs `github.app.secretName`; replaces
  # `gitAuthSecretName`): the chart renders the Secret
  # `<fullname>-skills-token` without data in `kagent.namespace` and every
  # `kagent.additionalNamespaces` entry, plus a Role that may only get and
  # update that Secret, and composes it as every git-skill agent's
  # `skillsGitAuthSecretRef.name`. agent-manager writes an installation token
  # into it (key `token`, the Basic form of `x-access-token:<token>`) and
  # replaces it well before its one-hour expiry; `get_info` reports the
  # last refresh and a failed one as `skillsGitAuthMint`.
  mintGitAuthSecret: false
  # -- How long a repository's discovered skills are reused.
  cacheTTL: 5m

mcp:
  # -- Serve the MCP streamable-HTTP endpoint alongside the REST API.
  enabled: true
  # -- MCP endpoint path.
  path: /mcp

oauth:
  # -- Make agent-manager an OAuth 2.1 resource server (mcp-oauth): the MCP
  # endpoint and the REST API require a bearer token the platform identity
  # provider issued, and every call carries the caller's identity (logged on
  # every write, returned as `requestedBy`). On the Agent Platform muster
  # forwards the session's IdP id_token to this server (MCPServer
  # `auth.forwardToken`, rendered below) and the portal sends the signed-in
  # user's id_token through the gateway; both are validated against the IdP's
  # JWKS when their audience is in `trustedAudiences`. Off: anonymous, acting
  # as the ServiceAccount — only for a server nothing but a trusted proxy can
  # reach.
  enabled: false
  # -- Public base URL of this server: the issuer of its own OAuth metadata
  # (https, or http on loopback). Empty derives
  # `https://<fullname>.<global.domain>` when `global.domain` is set.
  baseURL: ""
  # -- Identity provider: `dex` or `google`.
  provider: dex
  dex:
    # -- Dex issuer URL. Empty falls back to `global.identity.issuerUrl`.
    issuerURL: ""
    # -- Dex OAuth client ID. Empty falls back to `global.identity.clientId`.
    clientID: ""
    # -- Dex OAuth client secret (prefer `oauth.existingSecret`).
    clientSecret: ""
    # -- Let the issuer resolve to a private or loopback address (an
    # in-cluster Dex).
    allowPrivateURLs: false
    # -- Secret with the CA of a Dex that serves a private certificate;
    # mounted and passed as `--dex-ca-file`. Empty name falls back to
    # `global.identity.ca.secretName` / `global.identity.ca.key`.
    caSecret:
      name: ""
      key: ca.crt
  google:
    # -- Google OAuth client ID (not secret; may also come from the Secret key
    # `google-client-id` when empty).
    clientID: ""
    # -- Google OAuth client secret (prefer `oauth.existingSecret`).
    clientSecret: ""
  # -- Existing Secret with the provider credentials: `dex-client-secret`
  # (dex) or `google-client-secret` (+ optional `google-client-id`) (google).
  # Empty falls back to `global.identity.existingSecret`, whose
  # `dex-client-secret` is the platform client's; without that, the chart
  # renders a Secret from the values above.
  existingSecret: ""
  # -- OAuth client IDs whose IdP id_tokens are accepted as bearer tokens (SSO
  # token forwarding). Empty falls back to `[global.identity.clientId]`, the
  # platform client MCP clients and the muster CLI log in with. The server
  # trusts the union of this list and `muster.mcpServer.auth.requiredAudiences`
  # (in that order, without duplicates): every token muster forwards carries
  # the required audiences by construction and they are what the
  # kube-apiserver trusts, so a portal session — whose id_token carries them
  # but not the platform client — is accepted without listing its client here.
  trustedAudiences: []
  sso:
    # -- Let the IdP's JWKS endpoint resolve to a private address when
    # validating forwarded tokens (an in-cluster Dex).
    allowPrivateIPs: false
  # -- Accept unauthenticated dynamic client registration (labs only).
  allowPublicClientRegistration: false
  downstream:
    # -- Call the Kubernetes API as the caller: everything a request does
    # (HelmReleases and OCIRepositories, the AgentTemplates, RemoteMCPServers,
    # Harnesses, ModelConfigs and events it reads) presents the caller's IdP
    # token,
    # so the caller's RBAC governs — the apiserver must trust the IdP and the
    # token's audience (a Dex install lists that audience in
    # `muster.mcpServer.auth.requiredAudiences`; a Google install's client id
    # is the apiserver's `--oidc-client-id`). The ServiceAccount then holds no
    # permissions: the chart renders none of its Roles (`rbac.create` is
    # moot) and the token stays mounted only for the in-cluster API address
    # and CA plus API discovery at startup, which every authenticated
    # principal may read. agent-manager has no background work, so nothing is
    # lost: a request without a token is refused with 401 instead of running
    # as the ServiceAccount.
    enabled: false

github:
  # -- Register with muster pinned to the GitHub App
  # `giantswarm-agent-manager` and offer commit mode (`mode: commit` on
  # `create_agent`, `update_agent` and `delete_agent`: the manifests land as
  # a pull request opened as the person in the repository that owns the
  # namespace). The MCPServer's auth then pins the App as the authorization
  # server: muster runs the App's consent once per person and puts their user
  # token on every call, which this server verifies with `GET /user` and opens
  # the pull request with, and sets `forwardIdentity: true`, so muster
  # forwards the person's IdP ID token in `X-Muster-Id-Token` next to it and
  # apply mode keeps acting on Kubernetes as the person. Needs
  # `oauth.enabled`, and the App installed with contents and pull-request
  # write on every repository a commit may target. Off: muster forwards the
  # ID token as the bearer (`muster.mcpServer.auth.forwardToken`) and commit
  # mode answers `unsupported`.
  enabled: false
  # -- GitHub's REST API, for `GET /user` and the pull request.
  apiURL: https://api.github.com
  authorizationServer:
    # -- The issuer identity the person's grant is filed under: the App's
    # own, so the login App's GitHub grant stays separate. Also passed to the
    # server, which names it in its refusals.
    issuer: https://github.com/apps/giantswarm-agent-manager
    # -- The issuer GitHub puts in the RFC 9207 `iss` parameter of its
    # authorization response, `https://github.com/login/oauth` for every App.
    # Empty omits the field.
    expectedIssuer: https://github.com/login/oauth
    # -- GitHub's authorize endpoint (GitHub publishes no discovery document).
    authorizationEndpoint: https://github.com/login/oauth/authorize
    # -- GitHub's token endpoint.
    tokenEndpoint: https://github.com/login/oauth/access_token
    # -- The OAuth `scope` parameter, only for an authorization server that
    # needs one (a lab's stand-in); empty for GitHub, whose App permissions
    # are the App's. Empty omits the field.
    scopes: ""
    clientCredentialsSecretRef:
      # -- Secret with the App's OAuth client under `client-id` and
      # `client-secret`.
      name: giantswarm-agent-manager-oauth-client
      # -- Namespace of that Secret; empty is the release namespace.
      namespace: ""
    # -- `subject`: the grant belongs to the person, not to one login session.
    grantScope: subject

muster:
  # -- The platform's muster MCP URL, composed into every agent as the chart
  # value `muster.url` (the URL of the agent's own RemoteMCPServer). Empty
  # composes nothing and the Generic chart's default applies
  # (`http://muster.agent-platform.svc.cluster.local:8090/mcp`). The
  # `agent-platform` meta chart forwards it from its connectivity helper.
  url: ""
  # -- The muster MCP URL composed into an agent placed on a workload cluster
  # (create_agent with organization and cluster): one those clusters reach,
  # the installation's public muster endpoint. Empty refuses target clusters.
  targetUrl: ""
  mcpServer:
    # -- Register this server with muster by rendering an
    # `mcpservers.muster.giantswarm.io` CR in the release namespace. Tools then
    # appear as `x_<name>_<tool>`.
    enabled: false
    # -- MCPServer CR name (drives the tool prefix).
    name: agent-manager
    # -- Start the server connection when muster initializes.
    autoStart: true
    # -- Human-readable description shown by muster.
    description: Agent lifecycle (create, update, delete, status, skills, model configs) for the Agent Platform
    # -- Extra labels on the MCPServer CR.
    labels: {}  # @schema additionalProperties: true
    # -- How muster authenticates to this server; rendered only with
    # `oauth.enabled`. `forwardToken` makes muster forward the session's IdP
    # id_token byte-identical (the SSO path this chart trusts through its
    # trusted audiences). `requiredAudiences` are extra audiences that token
    # must carry — the Dex cross-client audience the kube-apiserver trusts
    # (`dex-k8s-authenticator` on Giant Swarm clusters; agentlab's is
    # `kubernetes`) so `oauth.downstream` works; muster requests them at
    # login, so users re-login after a change. They are trusted as bearer
    # audiences by construction, since the server's trusted audiences are
    # `oauth.trustedAudiences` plus this list. A Google IdP has no
    # cross-client audiences: leave the list empty.
    auth:
      forwardToken: true
      requiredAudiences: []

httpRoute:
  # -- Expose the service through a Gateway API HTTPRoute.
  enabled: false
  # -- parentRefs of the HTTPRoute (required when enabled).
  parentRefs: []  # @schema item: object ; itemProperties: {name: {type: string}, namespace: {type: string}, sectionName: {type: string}, kind: {type: string}, group: {type: string}, port: {type: integer}}
  # -- Hostnames matched by the route.
  hostnames: []
  # -- Annotations on the HTTPRoute.
  annotations: {}  # @schema additionalProperties: true
  # -- Labels on the HTTPRoute.
  labels: {}  # @schema additionalProperties: true

networkPolicy:
  # -- Create a Kubernetes NetworkPolicy for the pod (off when an umbrella
  # chart renders the policies).
  enabled: false
  # -- Namespaces allowed to reach the API (label kubernetes.io/metadata.name).
  # Empty allows ingress from the release namespace only.
  ingressNamespaces: []
  # -- Allow egress to the Kubernetes API server.
  allowKubeAPI: true
  # -- Allow egress on 443 to every destination: the chart registry (schema
  # and version), GitHub (skill discovery and commit resolution) and the
  # registries of OCI skills (digest resolution). Vanilla NetworkPolicy cannot
  # select by name; narrow with egressCIDRs instead when the addresses are
  # known.
  allowInternet: true
  # -- Extra egress CIDRs.
  egressCIDRs: []
  # -- Namespaces allowed to scrape the metrics port (label
  # kubernetes.io/metadata.name), when `observability.metrics.enabled`.
  metricsNamespaces:
    - kube-system

serviceAccount:
  # -- Create a ServiceAccount.
  create: true
  # -- Annotations on the ServiceAccount.
  annotations: {}  # @schema additionalProperties: true
  # -- ServiceAccount name (generated when empty).
  name: ""

rbac:
  # -- Create the Role/RoleBinding in `kagent.namespace` (and every
  # `kagent.additionalNamespaces` entry): HelmReleases and OCIRepositories
  # read/write; AgentTemplates, RemoteMCPServers, Harnesses, ModelConfigs and
  # events read (AgentTemplates and RemoteMCPServers also delete, for the
  # forced removal of what a suspended or bare release leaves behind) — the
  # ServiceAccount's own permissions. Ignored with `oauth.downstream.enabled`:
  # the ServiceAccount then gets no RBAC at all, the caller's RBAC governs.
  create: true

# -- Annotations on the pod.
podAnnotations: {}  # @schema additionalProperties: true
# -- Labels on the pod.
podLabels: {}  # @schema additionalProperties: true

# -- Pod security context.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# -- Container security context.
securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

service:
  # -- Service type.
  type: ClusterIP
  # -- Service port (container listens on 8080).
  port: 8080

# -- Container resources.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
    # `/tmp` is an emptyDir, the only writable path with
    # `readOnlyRootFilesystem`. Kyverno's require-emptydir-requests-and-limits
    # policy on Giant Swarm clusters reports (audit) or rejects (enforce) a
    # container that mounts an emptyDir without ephemeral-storage requests
    # and limits, so both are set here.
    ephemeral-storage: 50Mi
  limits:
    cpu: 500m
    memory: 256Mi
    ephemeral-storage: 100Mi

observability:
  otel:
    # -- OTLP collector URL for traces, e.g.
    # `http://otlp-gateway.kube-system.svc:4317` (gRPC) or
    # `https://tempo.example.com:4318` (with protocol `http/protobuf`). Empty
    # exports nothing; inbound `traceparent` headers still propagate. With
    # `networkPolicy.enabled` the policy opens egress to it: the Service's
    # namespace for an in-cluster host, every address otherwise.
    endpoint: ""
    # -- OTLP protocol: `grpc` or `http/protobuf`.
    protocol: grpc  # @schema enum: [grpc, http/protobuf]
    # -- OTLP headers (`OTEL_EXPORTER_OTLP_HEADERS`), e.g.
    # `X-Scope-OrgID=giantswarm` for a multi-tenant collector.
    headers: ""
    # -- Resource attributes appended to the downward-API `k8s.pod.name`,
    # `k8s.namespace.name` and `k8s.node.name`, e.g.
    # `deployment.environment=glean`.
    resourceAttributes: ""
    # -- `OTEL_TRACES_SAMPLER`. The parent-based default follows the caller's
    # sampling decision and samples `samplerArg` of the traces that start here.
    sampler: parentbased_traceidratio
    # -- `OTEL_TRACES_SAMPLER_ARG`.
    samplerArg: "0.1"
  metrics:
    # -- Serve Prometheus metrics on `GET /metrics` of the `metrics` port:
    # `mcp_server_operation_duration_seconds` per tool, and
    # `http_server_request_duration_seconds` for the REST API and the MCP
    # endpoint. Off, `OTEL_METRICS_EXPORTER=none`: nothing is served, and
    # nothing is pushed to `observability.otel.endpoint` either.
    enabled: true
    # -- Port of the metrics listener, apart from the API port so an
    # HTTPRoute or the OAuth guard never covers it.
    port: 9464

serviceMonitor:
  # -- Render a ServiceMonitor for the `metrics` port. Also needs
  # `observability.metrics.enabled`; the meta chart turns this on with the
  # tenant label.
  enabled: false
  # -- Scrape interval; empty uses the Prometheus Operator default.
  interval: ""
  # -- Labels on the ServiceMonitor, beside the chart's own. The Giant Swarm
  # observability platform routes a scrape to a Mimir tenant by
  # `observability.giantswarm.io/tenant`; a monitor without it writes to no
  # tenant.
  labels: {}  # @schema additionalProperties: true

logging:
  # -- Enable debug logging.
  verbose: false

# -- Extra container arguments.
extraArgs: []
# -- Extra environment variables.
extraEnv: []  # @schema item: object ; itemProperties: {name: {type: string}, value: {type: string}, valueFrom: {type: object, additionalProperties: true}}

# -- Node selector.
nodeSelector: {}  # @schema additionalProperties: true
# -- Tolerations.
tolerations: []  # @schema item: object ; itemProperties: {key: {type: string}, operator: {type: string}, value: {type: string}, effect: {type: string}, tolerationSeconds: {type: integer}}
# -- Affinity.
affinity: {}  # @schema additionalProperties: true
