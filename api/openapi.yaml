openapi: 3.1.0
info:
  title: agent-manager API
  version: 2.0.0
  description: |
    Agent lifecycle for the Giant Swarm Agent Platform on kagent API v2.

    An agent is a Flux `HelmRelease` of the Generic `agent` chart (1.x: one
    release renders one `kagent.dev/v1alpha3` `AgentTemplate` plus the agent's
    own muster `RemoteMCPServer`) that renders from the shared per-namespace
    `OCIRepository` of that chart, tracking it at `1.x`. agent-manager composes
    those two objects exactly like the portal's create flow, pins every skill
    to a commit or a digest, validates the values against the chart's
    `values.schema.json` before anything is applied, and reads an agent back
    from its AgentTemplate, its RemoteMCPServer and its owning HelmRelease.
    Readiness is the platform Harness's entry in the template's
    `status.harnesses[]`; there is no per-agent Deployment or pod.

    Clients MUST call `GET /api/v1/info` first: it reports the managed
    namespaces, the chart version whose schema validates right now, and the
    capability flags (a false flag means the operation answers `501
    unsupported`) and `identity`: `caller` means the server is an OAuth 2.1
    resource server — every request needs a bearer token the platform IdP
    issued (muster forwards the session's id_token, the portal sends the
    user's through the gateway) and every Kubernetes call is made as that
    user, so the user's RBAC decides and writes report `requestedBy`;
    `serviceAccount` means no OAuth, the service's own identity behind a
    trusted proxy. Without a valid token the OAuth layer answers `401` with a
    `WWW-Authenticate: Bearer` challenge (RFC 9728) before any handler runs.

    The same operations are available as MCP tools (streamable HTTP at `/mcp`,
    tool names in `x-mcp-tool` below; through muster they appear as
    `x_<server>_<tool>`).

    Ownership rules: an agent whose HelmRelease is applied by a Flux
    Kustomization (`managed: gitops`) is refused for update and delete unless
    `force` — its desired state lives in git. A bare AgentTemplate
    (`managed: none`) has no HelmRelease to write to and is only deleted with
    `force`.

    Removed with kagent API v2: `runtime` (the platform Harness is the runtime
    of every agent) and `skills.gitAuthSecretName` (no per-source skill
    credential; branches and tags of private repositories are resolved with the
    service's own GitHub token). Both are refused with the reason.
servers:
  - url: /
tags:
  - name: info
  - name: agents
  - name: modelconfigs
  - name: skills
  - name: health
paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness
      operationId: healthz
      responses:
        "200":
          description: alive
          content:
            text/plain:
              schema: { type: string, example: ok }
  /readyz:
    get:
      tags: [health]
      summary: Readiness (the API is serving)
      description: |
        Does not depend on the API server or the chart registry: the API stays
        reachable so clients read a failure from the response itself.
      operationId: readyz
      responses:
        "200":
          description: ready
          content:
            text/plain:
              schema: { type: string, example: ok }
  /api/v1/info:
    get:
      tags: [info]
      summary: Service version, agent chart, managed namespaces, capability flags, API versions, platform Harness and muster URL
      operationId: getInfo
      x-mcp-tool: get_info
      responses:
        "200":
          description: the installation's identity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Info" }
  /api/v1/openapi.yaml:
    get:
      tags: [info]
      summary: This document
      operationId: getOpenAPI
      responses:
        "200":
          description: the contract
          content:
            application/yaml:
              schema: { type: string }
  /api/v1/agents:
    get:
      tags: [agents]
      summary: List the agents of a namespace
      description: |
        Every AgentTemplate with its RemoteMCPServer and its owning HelmRelease
        (found through the Flux provenance labels, possibly in another
        namespace), plus every HelmRelease of the agent chart that has not
        rendered a template yet (`exists: false`).
      operationId: listAgents
      x-mcp-tool: list_agents
      parameters:
        - $ref: "#/components/parameters/namespaceQuery"
      responses:
        "200":
          description: agents
          content:
            application/json:
              schema:
                type: object
                properties:
                  agents:
                    type: array
                    items: { $ref: "#/components/schemas/Agent" }
        "400": { $ref: "#/components/responses/Error" }
    post:
      tags: [agents]
      summary: Create an agent
      description: |
        Composes the OCIRepository (created when missing, tracking `1.x`) and
        the HelmRelease, pins every skill (a branch or tag to its head commit,
        an image tag to its digest), validates the values against the chart
        schema and the modelConfig against the namespace, then applies. A
        validation failure writes nothing (`400 invalid_request`, the message
        lists the valid model configs or names the unresolvable skill
        reference). `409 conflict` when a HelmRelease or AgentTemplate of that
        name exists.
      operationId: createAgent
      x-mcp-tool: create_agent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Spec" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateResult" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/agents/validate:
    post:
      tags: [agents]
      summary: Dry run of create (or update)
      description: |
        Composes and validates without writing; the manifests carry the skills
        as they would be pinned. With `update: true` the non-empty fields of
        the body are validated as a change to the existing agent's values
        (`refreshSkills` applies the same way).
      operationId: validateAgent
      x-mcp-tool: validate_agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/Spec"
                - type: object
                  properties:
                    update: { type: boolean, description: Validate as an update of the existing agent }
                    force: { type: boolean, description: With update, ignore the GitOps/suspended guards }
                    refreshSkills: { type: boolean, description: With update, re-pin every git skill to its default-branch head }
      responses:
        "200":
          description: the verdict (valid may be false)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidateResult" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/agents/{namespace}/{name}:
    parameters:
      - $ref: "#/components/parameters/namespacePath"
      - $ref: "#/components/parameters/namePath"
    get:
      tags: [agents]
      summary: Get one agent
      operationId: getAgent
      x-mcp-tool: get_agent
      responses:
        "200":
          description: the agent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [agents]
      summary: Update an agent
      description: |
        Merges the given fields into the HelmRelease values (absent fields stay,
        an empty string clears a field back to the chart default, `skills`
        replaces the whole list and is pinned, `toolset` replaces the whole
        list — the way to assign a toolset to an agent that reports
        `implicitFullAccess`; `refreshSkills` re-pins every git skill to the
        head of its repository's default branch — a skill passed with a `ref`
        in the same call to that ref's head — and changes nothing else),
        validates and updates the HelmRelease. `409 conflict` for GitOps-owned
        or suspended releases and bare AgentTemplates unless `force`. `400` for
        a body still carrying the removed `toolNames` or `runtime`.
      operationId: updateAgent
      x-mcp-tool: update_agent
      parameters:
        - name: force
          in: query
          schema: { type: boolean }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Update" }
      responses:
        "200":
          description: before / after
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateResult" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [agents]
      summary: Delete an agent
      description: |
        Deletes the owning HelmRelease (helm-controller uninstalls the
        AgentTemplate and the agent's RemoteMCPServer) and the shared
        OCIRepository when no other HelmRelease references it. Bare
        AgentTemplates, GitOps-owned and suspended releases need `force` (a
        forced delete of a suspended release removes the rendered objects
        too).
      operationId: deleteAgent
      x-mcp-tool: delete_agent
      parameters:
        - name: force
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: what was removed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeleteResult" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/agents/{namespace}/{name}/status:
    parameters:
      - $ref: "#/components/parameters/namespacePath"
      - $ref: "#/components/parameters/namePath"
    get:
      tags: [agents]
      summary: Compact status verdict
      description: |
        The AgentTemplate's `status.harnesses[]` entry for the platform Harness
        (ready: Ready and the desired revision is the latest successful one;
        progressing: a revision still compiling; failed: Accepted, ResolvedRefs
        or Compatible False with the condition's message, Ready False for a
        reason other than the pending one, or no Harness admitting the
        template), the HelmRelease conditions and history, and the namespace's
        recent Warning events on the agent's objects, folded into `verdict`
        (ready | progressing | failed | unknown) and `summary`.
      operationId: getAgentStatus
      x-mcp-tool: get_agent_status
      responses:
        "200":
          description: the status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/modelconfigs:
    get:
      tags: [modelconfigs]
      summary: List the kagent ModelConfigs of a namespace
      operationId: listModelConfigs
      x-mcp-tool: list_model_configs
      parameters:
        - $ref: "#/components/parameters/namespaceQuery"
      responses:
        "200":
          description: model configs
          content:
            application/json:
              schema:
                type: object
                properties:
                  modelConfigs:
                    type: array
                    items: { $ref: "#/components/schemas/ModelConfig" }
  /api/v1/skills:
    get:
      tags: [skills]
      summary: Discover skills in the configured repositories
      description: |
        Every `SKILL.md` of a GitHub repository is one skill (frontmatter
        `name`/`description`), with the ref it was read from and the head
        commit that ref resolved to — the commit a `skills` entry pins. Cached
        briefly; `refresh=true` re-reads GitHub. `501 unsupported` when no
        repositories are configured.
      operationId: listSkills
      x-mcp-tool: list_skills
      parameters:
        - name: repository
          in: query
          description: Only this repository (https://github.com/<owner>/<repo>)
          schema: { type: string }
        - name: ref
          in: query
          description: Git ref; default the default branch (the ref refreshSkills follows)
          schema: { type: string }
        - name: refresh
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: skills
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SkillsResult" }
        "400": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
components:
  parameters:
    namespaceQuery:
      name: namespace
      in: query
      description: Namespace; default the installation's kagent namespace
      schema: { type: string }
    namespacePath:
      name: namespace
      in: path
      required: true
      schema: { type: string }
    namePath:
      name: name
      in: path
      required: true
      schema: { type: string }
  responses:
    Error:
      description: error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum: [not_found, invalid_request, conflict, forbidden, unauthenticated, unsupported, backend_error]
            message: { type: string }
    Info:
      type: object
      properties:
        version: { type: string }
        chart:
          type: object
          properties:
            ociUrl: { type: string }
            semver: { type: string, description: The range the OCIRepository tracks (1.x) }
            latestVersion: { type: string, description: Newest published version in range ("" when the registry is unreachable) }
            schemaVersion: { type: string, description: Chart version whose values.schema.json validates right now }
            schemaSource: { type: string, enum: [registry, embedded] }
            resolvedAt: { type: string, format: date-time }
            error: { type: string }
        namespaces:
          type: object
          properties:
            default: { type: string }
            managed: { type: array, items: { type: string } }
        capabilities:
          type: object
          additionalProperties: { type: boolean }
          description: "list, get, create, update, delete, status, validate, modelConfigs, skills, writesAsCaller (true when identity is caller), commit (false: the write tools apply live, there is no pull-request mode)"
        identity:
          type: string
          enum: [caller, serviceAccount]
          description: >-
            How calls reach the Kubernetes API. `caller`: the server runs as an OAuth 2.1 resource
            server (mcp-oauth) with downstream OAuth — every call presents the signed-in user's IdP
            id_token (forwarded by muster, or sent by the portal through the gateway) and the user's
            RBAC governs; the ServiceAccount holds no permissions. `serviceAccount`: no OAuth, the
            service's own identity behind a trusted proxy.
        apiVersions:
          type: object
          description: The served kagent.dev version (agentTemplate, harness, remoteMcpServer, modelConfig) and the Flux versions composed into every agent
          properties:
            agentTemplate: { type: string, example: kagent.dev/v1alpha3 }
            harness: { type: string }
            remoteMcpServer: { type: string }
            modelConfig: { type: string }
            helmRelease: { type: string }
            ociRepository: { type: string }
        flux:
          type: object
          properties:
            helmReleaseInterval: { type: string }
            ociRepositoryInterval: { type: string }
            serviceAccountName: { type: string }
        harness:
          type: object
          description: The platform Harness every agent runs on; composed as the chart value agent.harness and the status entry get_agent_status reads
          properties:
            name: { type: string, example: kagent }
        muster:
          type: object
          properties:
            url: { type: string, description: The muster MCP URL composed into every agent as muster.url; empty means the chart default applies }
        skillsRepositories: { type: array, items: { type: string } }
    GitSkill:
      type: object
      required: [url]
      properties:
        url: { type: string, description: http(s) URL of the repository }
        ref: { type: string, description: Branch or tag resolved to its head commit at write time; omit (with commit) for the pin, omit both for the default branch. Never written. }
        commit: { type: string, pattern: '^([0-9a-fA-F]{40}|[0-9a-fA-F]{64})$', description: Full commit id, the pin (list_skills reports it); what is written and read back }
    Skill:
      type: object
      description: One skill, pinned to an immutable source — exactly one of git and oci
      properties:
        name: { type: string, description: Name the skill mounts under, unique per agent; defaults to the last path segment, else the repository or image name }
        path: { type: string, description: Skill directory (git skills), relative without '..'; empty for the repository root }
        git: { $ref: "#/components/schemas/GitSkill" }
        oci: { type: string, description: "<registry>/<repository>:<tag> (resolved to its digest at write time) or <registry>/<repository>@sha256:<digest> (the pin)" }
    Skills:
      type: array
      description: The agent's skills; every entry is pinned before it is written. The 0.x object shape ({refs, gitRefs, gitAuthSecretName}) is refused with the reason.
      items: { $ref: "#/components/schemas/Skill" }
    Toolset:
      type: array
      minItems: 1
      maxItems: 32
      items: { type: string, pattern: '^(preset|server|workflow|tool):[^\s,]+$' }
      description: |
        The selectors that bound which of the gateway's tools the agent's
        meta-tools can see and call — composed as the agent chart's top-level
        `toolset` value, rendered as the `X-Muster-Toolset` header on the
        agent's own RemoteMCPServer, resolved by muster per caller. Each selector
        is `preset:<name>`, `server:<name>`, `workflow:<name>` or `tool:<name>`
        (exact names, at most 32 — define a preset for more). Shipped presets:
        `read-only`, `none` (a chat-only agent without tools), `infrastructure`,
        `agent-platform`, `full` (every tool the gateway exposes). `toolset:` is
        reserved, `label:` exists inside presets only, an empty list is refused
        (use `preset:none`). The former `toolNames` never narrowed anything
        against muster (kagent filters muster's meta-tools only) and is refused
        with that explanation.
    Spec:
      type: object
      required: [name, modelConfig, toolset]
      properties:
        namespace: { type: string }
        name: { type: string, description: DNS-1123 technical name (HelmRelease and AgentTemplate name), max 63 chars }
        displayName: { type: string, maxLength: 63 }
        description: { type: string }
        systemMessage: { type: string }
        modelConfig: { type: string, description: An existing ModelConfig of the namespace }
        iconUrl: { type: string, description: Avatar URL (chart agent.iconUrl, the ui.giantswarm.io/icon-url annotation) }
        skills: { $ref: "#/components/schemas/Skills" }
        toolset: { $ref: "#/components/schemas/Toolset" }
        labels: { type: object, additionalProperties: { type: string } }
        annotations: { type: object, additionalProperties: { type: string } }
    Update:
      type: object
      description: Partial change; absent fields stay, "" clears, skills replace the whole list (pinned), toolset replaces the whole list, refreshSkills re-pins every git skill
      properties:
        displayName: { type: string }
        description: { type: string }
        systemMessage: { type: string }
        modelConfig: { type: string }
        iconUrl: { type: string }
        skills: { $ref: "#/components/schemas/Skills" }
        refreshSkills: { type: boolean, description: Re-resolve every git skill to the head of its repository's default branch (a skill in skills with a ref goes to that ref's head); nothing else changes }
        toolset: { $ref: "#/components/schemas/Toolset" }
        labels: { type: object, additionalProperties: { type: string } }
        annotations: { type: object, additionalProperties: { type: string } }
        force: { type: boolean }
    Condition:
      type: object
      properties:
        type: { type: string }
        status: { type: string }
        reason: { type: string }
        message: { type: string }
        lastTransitionTime: { type: string }
        observedGeneration: { type: integer }
    HarnessStatus:
      type: object
      description: One AgentTemplate.status.harnesses[] entry
      properties:
        harness: { type: string }
        ready: { type: [boolean, "null"] }
        accepted: { type: [boolean, "null"] }
        resolvedRefs: { type: [boolean, "null"] }
        compatible: { type: [boolean, "null"] }
        desiredRevision: { type: string }
        latestSuccessfulRevision: { type: string }
        conditions: { type: array, items: { $ref: "#/components/schemas/Condition" } }
        warnings: { type: array, items: { type: string } }
    ToolBinding:
      type: object
      description: One MCP binding of the AgentTemplate (spec.tools[].mcp)
      properties:
        server: { type: string, description: The RemoteMCPServer bound, same namespace }
        tools: { type: array, items: { type: string }, description: The binding narrowed to these tools; empty is every tool }
    HelmReleaseRef:
      type: object
      properties:
        name: { type: string }
        namespace: { type: string }
        ready: { type: [boolean, "null"] }
        reason: { type: string }
        message: { type: string }
        chartVersion: { type: string }
        lastAttemptedRevision: { type: string }
        suspended: { type: boolean }
        gitOpsOwned: { type: boolean }
        deleting: { type: boolean, description: helm-controller is uninstalling the release; the template disappears with it }
        chartRef:
          type: object
          properties:
            kind: { type: string }
            name: { type: string }
            namespace: { type: string }
    Agent:
      type: object
      properties:
        name: { type: string }
        namespace: { type: string }
        exists: { type: boolean, description: The AgentTemplate exists (false while the HelmRelease has not rendered it) }
        displayName: { type: string, description: From the ui.giantswarm.io/display-name annotation }
        description: { type: string }
        modelConfig: { type: string }
        iconUrl: { type: string, description: From the ui.giantswarm.io/icon-url annotation }
        systemMessage: { type: string }
        skills: { $ref: "#/components/schemas/Skills", description: As pinned — git skills by commit, OCI skills by digest }
        toolset: { $ref: "#/components/schemas/Toolset", description: The declared toolset (the HelmRelease's `toolset` value; for a bare AgentTemplate the X-Muster-Toolset header of the agent's RemoteMCPServer); absent when none is declared }
        implicitFullAccess: { type: boolean, description: True when the agent declares no toolset but binds muster — its meta-tools see every tool the gateway exposes to the caller; such agents predate toolsets and still need one (update_agent) }
        tools: { type: array, items: { $ref: "#/components/schemas/ToolBinding" } }
        ready: { type: [boolean, "null"], description: The platform Harness's verdict on the template (Ready and the desired revision is the latest successful one); null while unreported }
        harnesses: { type: array, items: { $ref: "#/components/schemas/HarnessStatus" } }
        managed: { type: string, enum: [helmrelease, gitops, none] }
        helmRelease: { $ref: "#/components/schemas/HelmReleaseRef" }
        values: { type: object, description: The HelmRelease's inline values (the chart contract) }
    Manifests:
      type: object
      properties:
        ociRepository: { type: string, description: YAML }
        helmRelease: { type: string, description: YAML }
        values: { type: object }
    ValidateResult:
      type: object
      properties:
        valid: { type: boolean }
        mode: { type: string, enum: [create, update] }
        errors: { type: array, items: { type: string } }
        schemaVersion: { type: string }
        schemaSource: { type: string, enum: [registry, embedded] }
        manifests: { $ref: "#/components/schemas/Manifests" }
    CreateResult:
      type: object
      properties:
        agent: { $ref: "#/components/schemas/Agent" }
        manifests: { $ref: "#/components/schemas/Manifests" }
        created:
          type: object
          properties:
            ociRepository: { type: boolean }
            helmRelease: { type: boolean }
        status: { $ref: "#/components/schemas/Status" }
        requestedBy: { type: string, description: The authenticated caller the write ran as (email, else subject); absent without OAuth }
    UpdateResult:
      type: object
      properties:
        agent: { $ref: "#/components/schemas/Agent" }
        before: { type: object }
        after: { type: object }
        changed: { type: array, items: { type: string }, description: Dotted value paths that changed }
        requestedBy: { type: string, description: The authenticated caller the write ran as }
        manifests: { $ref: "#/components/schemas/Manifests" }
    DeleteResult:
      type: object
      properties:
        name: { type: string }
        namespace: { type: string }
        helmReleaseDeleted: { type: boolean }
        agentTemplateDeleted: { type: boolean, description: The AgentTemplate was deleted directly (force, a bare template or a suspended release) }
        remoteMcpServerDeleted: { type: boolean, description: The agent's RemoteMCPServer was deleted directly (force, a suspended release) }
        ociRepositoryDeleted: { type: boolean }
        ociRepositoryKept: { type: string, description: Why the shared chart source stays }
        requestedBy: { type: string, description: The authenticated caller the delete ran as }
    Status:
      type: object
      properties:
        name: { type: string }
        namespace: { type: string }
        verdict: { type: string, enum: [ready, progressing, failed, unknown] }
        summary: { type: string }
        template:
          type: object
          description: The AgentTemplate's status, one entry per admitting Harness
          properties:
            exists: { type: boolean }
            generation: { type: integer }
            observedGeneration: { type: integer }
            harnesses: { type: array, items: { $ref: "#/components/schemas/HarnessStatus" } }
        helmRelease:
          type: object
          properties:
            exists: { type: boolean }
            ready: { type: [boolean, "null"] }
            suspended: { type: boolean }
            gitOpsOwned: { type: boolean }
            deleting: { type: boolean }
            conditions: { type: array, items: { $ref: "#/components/schemas/Condition" } }
            history:
              type: array
              items:
                type: object
                properties:
                  version: { type: integer }
                  chartVersion: { type: string }
                  status: { type: string }
                  lastDeployed: { type: string }
            lastAttemptedRevision: { type: string }
        events:
          type: array
          description: Recent Warning events on the agent's objects (AgentTemplate, RemoteMCPServer, HelmRelease)
          items:
            type: object
            properties:
              type: { type: string }
              reason: { type: string }
              message: { type: string }
              object: { type: string }
              count: { type: integer }
              lastTimestamp: { type: string }
    ModelConfig:
      type: object
      properties:
        name: { type: string }
        namespace: { type: string }
        provider: { type: string }
        model: { type: string }
        accepted: { type: [boolean, "null"] }
        message: { type: string }
        managedBy: { type: string }
    DiscoveredSkill:
      type: object
      description: A SKILL.md found in a repository, with the commit an agent pins it at
      properties:
        name: { type: string }
        description: { type: string }
        repoUrl: { type: string }
        path: { type: string }
        ref: { type: string, description: The ref read (the default branch unless ref was given) }
        commit: { type: string, description: The head commit of that ref when it was read — the pin for a skills entry }
    SkillsResult:
      type: object
      properties:
        repositories:
          type: array
          items:
            type: object
            properties:
              repoUrl: { type: string }
              ref: { type: string }
              commit: { type: string, description: What ref resolved to when the repository was read }
              skills: { type: array, items: { $ref: "#/components/schemas/DiscoveredSkill" } }
              truncated: { type: boolean }
              error: { type: string }
              fetchedAt: { type: string, format: date-time }
        skills: { type: array, items: { $ref: "#/components/schemas/DiscoveredSkill" } }
