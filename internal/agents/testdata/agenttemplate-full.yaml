# What Generic chart 1.x renders for an agent with every value set, as
# helm-controller stamps and kagent reports it.
apiVersion: kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: sre
  namespace: kagent
  generation: 2
