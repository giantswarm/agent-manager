# The fleet's GitOps-owned SRE agent: a HelmRelease of the Generic chart in
# flux-giantswarm, applied by a Flux Kustomization (the kustomize labels),
# rendering into kagent (targetNamespace). Fleet shape 3. The
# driftDetection.ignore paths name v1alpha2 fields a Kyverno mutation of the
# 0.10 platform injected.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sre-agent
  namespace: flux-giantswarm
  labels:
    kustomize.toolkit.fluxcd.io/name: flux-giantswarm
    kustomize.toolkit.fluxcd.io/namespace: flux-giantswarm
  uid: 3c1b2a9e-6a3f-4b5e-9a0c-1d2e3f4a5b6c
  resourceVersion: "812345"
  generation: 4
spec:
  releaseName: sre-agent
  chartRef:
    kind: OCIRepository
    name: agent
    namespace: flux-giantswarm
  interval: 10m
  targetNamespace: kagent
  timeout: 10m
  install:
    remediation:
      retries: 10
      remediateLastFailure: false
  upgrade:
    remediation:
      retries: 10
      remediateLastFailure: false
  driftDetection:
    mode: enabled
    ignore:
      - paths:
          - /spec/declarative/deployment/podSecurityContext
          - /spec/declarative/deployment/securityContext
  values:
    agent:
      displayName: SRE Agent
      description: Giant Swarm SRE agent
      runtime: python
      systemMessage: |
        You are a Giant Swarm SRE agent. Prefer read-only diagnosis.
    muster:
      serverRef:
        namespace: agent-platform
      toolNames:
        - list_tools
        - describe_tool
        - filter_tools
        - call_tool
status:
  conditions:
    - type: Ready
      status: "True"
      reason: UpgradeSucceeded
      message: Helm upgrade succeeded
  history:
    - version: 7
      chartVersion: 0.6.1
      status: deployed
      lastDeployed: "2026-09-09T10:00:00Z"
  lastAttemptedRevision: 0.6.1
